const GK_FRAMES={
  shuffle:[[46,276,132,126],[191,276,153,126],[365,276,147,126]],
  chest_drum:[[165,78,198,126]],
  jump_atk:[[34,474,120,132],[164,474,120,132],[296,474,114,132],[416,474,114,132]],
};
const NAMES={shuffle:'shuffle（通常移動）',chest_drum:'chest_drum（攻撃1）',jump_atk:'jump_atk（攻撃2）'};
const FPS={shuffle:5,chest_drum:2,jump_atk:6};

let spriteCanvas=null;
const animStates=[];

function removeBG(src){
  const oc=document.createElement('canvas');
  oc.width=src.width;oc.height=src.height;
  const ox=oc.getContext('2d');
  ox.drawImage(src,0,0);
  const d=ox.getImageData(0,0,oc.width,oc.height);
  for(let i=0;i<d.data.length;i+=4){
    if(d.data[i]<50&&d.data[i+1]<50&&d.data[i+2]<50)d.data[i+3]=0;
  }
  ox.putImageData(d,0,0);
  return oc;
}

function setup(img){
  spriteCanvas=removeBG(img);
  const container=document.getElementById('canvases');
  for(const [anim,frames] of Object.entries(GK_FRAMES)){
    const DH=280;
    const maxW=Math.max(...frames.map(([sx,sy,sw,sh])=>Math.round(DH*sw/sh)))+20;
    const cv=document.createElement('canvas');
    cv.width=maxW;cv.height=DH+40;
    const ctx=cv.getContext('2d');
    const wrap=document.createElement('div');
    const h=document.createElement('h2');h.textContent=NAMES[anim];
    wrap.appendChild(h);wrap.appendChild(cv);
    container.appendChild(wrap);
    animStates.push({ctx,frames,fps:FPS[anim],fi:0,t:0,DH,maxW});
  }
  requestAnimationFrame(loop);
}

let last=null;
function loop(ts){
  if(!last)last=ts;
  const dt=(ts-last)/1000;last=ts;
  for(const s of animStates){
    s.t+=dt;
    if(s.t>=1/s.fps){s.t=0;s.fi=(s.fi+1)%s.frames.length;}
    const {ctx,frames,fi,DH,maxW}=s;
    const [sx,sy,sw,sh]=frames[fi];
    const DW=Math.round(DH*sw/sh);
    ctx.clearRect(0,0,maxW,DH+40);
    ctx.fillStyle='#1a2a1a';ctx.fillRect(0,0,maxW,DH+40);
    ctx.fillStyle='#3a5a3a';ctx.fillRect(0,DH+8,maxW,32);
    ctx.drawImage(spriteCanvas,sx,sy,sw,sh,(maxW-DW)/2,6,DW,DH);
    ctx.fillStyle='#888';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText('frame '+(fi+1)+'/'+frames.length,maxW/2,DH+26);
  }
  requestAnimationFrame(loop);
}

const a=new Image();
a.onload=function(){setup(a);};
a.src='data:image/png;base64,'+b64;
