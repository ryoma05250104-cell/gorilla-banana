<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゴリラステージ　エンディング</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
canvas{display:block;max-width:100%;max-height:90vh;image-rendering:pixelated;}
#btn{margin-top:14px;padding:10px 36px;font-size:18px;background:#FFD700;border:none;border-radius:8px;cursor:pointer;font-weight:bold;}
</style>
</head><body>
<canvas id="c" width="960" height="540"></canvas>
<button id="btn" onclick="restart()">▶ 再生</button>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const CW=960,CH=540;

// ---- テキスト内容 ----
const LINES=[
  'ゲンちゃんのおかげで、',
  'タクミはしょうきをとりもどした。',
  '',
  'みためはゴリラ、ずのうはにんげんのまま——',
  'これからもいままでどおり、',
  'しあわせにくらしましたとさ。',
];
const END_WORD='おしまい';

// ---- タイミング ----
// 各行は0.6秒ごとにフェードイン
const LINE_DELAY=0.65;   // 行ごとの遅延
const LINE_FADE=0.5;     // フェードイン時間
const END_START=LINES.length*LINE_DELAY+0.8;
const END_FADE=0.8;
const TOTAL=END_START+END_FADE+2.0;

let t=0,last=null,raf=null;

// 星パーティクル
const STARS=[];
for(let i=0;i<80;i++)STARS.push({x:Math.random()*CW,y:Math.random()*CH,r:Math.random()*1.4+0.3,a:Math.random()});

function drawBG(t){
  // 夜空グラデーション
  const g=ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#0a0014');
  g.addColorStop(1,'#0e2200');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);

  // 星
  STARS.forEach(s=>{
    const twinkle=0.5+0.5*Math.sin(t*1.2+s.a*10);
    ctx.fillStyle=`rgba(255,255,220,${0.4+0.5*twinkle})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });

  // 下部ジャングルシルエット
  ctx.fillStyle='#0d1f00';
  ctx.beginPath();
  ctx.moveTo(0,CH);
  const pts=[0,480,80,430,160,450,240,410,320,440,400,405,480,435,560,408,640,430,720,415,800,440,880,420,960,445,960,CH];
  for(let i=0;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);
  ctx.closePath();ctx.fill();
}

function draw(ts){
  if(last===null)last=ts;
  const dt=(ts-last)/1000;last=ts;
  t+=dt;

  ctx.clearRect(0,0,CW,CH);
  drawBG(t);

  // 本文
  ctx.textAlign='center';
  LINES.forEach((ln,i)=>{
    const startT=i*LINE_DELAY;
    const alpha=Math.min(1,Math.max(0,(t-startT)/LINE_FADE));
    if(alpha<=0)return;
    if(ln===''){return;}
    const isTitle= i<2;
    ctx.font=isTitle?'bold 32px "Hiragino Kaku Gothic Pro",sans-serif':'28px "Hiragino Kaku Gothic Pro",sans-serif';
    ctx.fillStyle=`rgba(255,255,200,${alpha})`;
    // 影
    ctx.shadowColor=`rgba(255,200,0,${alpha*0.6})`;
    ctx.shadowBlur=12;
    const baseY= i===0?165: i===1?205: i>=3?CH/2-20+(i-3)*48:0;
    ctx.fillText(ln,CW/2,baseY);
    ctx.shadowBlur=0;
  });

  // おしまい
  const endAlpha=Math.min(1,Math.max(0,(t-END_START)/END_FADE));
  if(endAlpha>0){
    // グロー
    ctx.shadowColor=`rgba(255,220,0,${endAlpha*0.8})`;
    ctx.shadowBlur=30;
    ctx.font=`bold ${Math.round(64+4*Math.sin(t*2))}px "Hiragino Kaku Gothic Pro",sans-serif`;
    ctx.fillStyle=`rgba(255,235,80,${endAlpha})`;
    ctx.fillText(END_WORD,CW/2,CH*0.82);
    ctx.shadowBlur=0;
  }

  if(t<TOTAL)raf=requestAnimationFrame(draw);
  else{
    // 最後に静止
    ctx.fillStyle='rgba(0,0,0,0)';
  }
}

function restart(){
  if(raf)cancelAnimationFrame(raf);
  t=0;last=null;
  raf=requestAnimationFrame(draw);
}

restart();
</script>
</body></html>
