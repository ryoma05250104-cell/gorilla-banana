/* ── 画面端チェック（マリオ方式：自由スクロール） ── */
function checkScreenEdge(){
  if(gs===GS.BOSS)return;
  // 左端壁
  if(player.x<0){player.x=0;player.vx=0;}
  // ボス部屋シャッター判定
  if(gs!==GS.BOSS&&player.x+player.w>=stage.shutterX){
    gs=GS.TRANS;transTimer=0;transCamDone=false;stopBGM();return;
  }
  // 右端到達（ステージクリア）
  if(player.x+player.w>=stage.worldW-10){
    if(stageNum===1){gs=GS.CASTLE;castleT=0;}
    else{player.x=stage.worldW-player.w-10;player.vx=0;}
  }
}

/* ── カメラ更新（マリオ風スムーズ追従） ── */
function updateCamera(dt){
  if(gs===GS.BOSS){
    const bossLeft=stage.shutterX+60;
    camX+=(player.x-CW*.38-camX)*.1;
    camX=Math.max(bossLeft,Math.min(camX,stage.worldW-CW));
    return;
  }
  // マリオ式: プレイヤーを画面40%の位置に滑らかに追従
  const target=player.x-CW*0.38;
  camX+=(target-camX)*0.15;
  camX=Math.max(0,Math.min(camX,stage.worldW-CW));
}

function updatePlay(dt){
  // 病院判定
  if(hospCooldown>0)hospCooldown-=dt;
  if(hospCooldown<=0){
    const hx=stage.hospX,hw=stage.hospW;
    if(player.x+player.w>hx+hw*.3&&player.x<hx+hw*.9&&player.y+player.h>455){
      hospCooldown=3;
      if(player.mode===1){
        player.gp=MAX_GP;
        hospLines=['なつこさん：あら、たくみじゃない！\nGP（ゴリラポイント）を回復しておくわね。',
                   'ウホッ！ウホホホホ！ウッホホ！\n（ありがとう！なっちゃん！キリッ）'];
      } else {
        hospLines=['なつこさん：ごめんなさい、\nうちは人間はみれないの。さようなら。',
                   'たくみ：なっちゃん俺だよ！たくみだよ～'];
      }
      hospIdx=0;hospTimer=4;gs=GS.HOSP;return;
    }
  }

  // 皮
  for(let i=peels.length-1;i>=0;i--){peels[i].update(stage.plats);if(!peels[i].alive)peels.splice(i,1);}
  // 黄金バナナアイテム
  for(let i=goldenBananaItems.length-1;i>=0;i--){
    const ha=goldenBananaItems[i];
    ha.update(stage.plats);
    // 拾う判定: プレイヤー周囲40pxまで広げる
    if(ha.alive&&overlapR(player.x-40,player.y-20,player.w+80,player.h+40,ha.x,ha.y,ha.w,ha.h)){
      ha.alive=false;
      if(player.powerLevel<3)player.powerLevel++;
      player.goldenCount++;
      player.inv=Math.max(player.inv,0.05);
      if(player.goldenCount>=4&&gs===GS.PLAY){gs=GS.GOLDEN;goldenCutinT=0;stopBGM();stopBossBGM();}
    }
    if(!ha.alive)goldenBananaItems.splice(i,1);
  }
  // オーラ
  for(let i=auras.length-1;i>=0;i--){
    auras[i].update(stage.enemies,stage.plats);
    if(!auras[i].alive)auras.splice(i,1);
  }
  // ドロップバナナ
  for(let i=droppedBananas.length-1;i>=0;i--){
    const db=droppedBananas[i];
    db.update(stage.plats);
    if(db.alive&&overlapR(player.x-30,player.y-10,player.w+60,player.h+20,db.x,db.y,db.w,db.h)){
      db.alive=false;player.gp=Math.min(MAX_GP,player.gp+1);
    }
    if(!db.alive)droppedBananas.splice(i,1);
  }
  // 爆発エフェクト
  for(let i=explosions.length-1;i>=0;i--){
    explosions[i].update(dt);
    if(!explosions[i].alive)explosions.splice(i,1);
  }
  // プレイヤー
  player.update(dt,stage.plats,stage.bananas,stage.enemies,stage);
  // 落とし穴（ステージ2）: 画面外に落ちたらGP-1でリスポーン
  if(stageNum===2&&gs===GS.PLAY&&player.y>CH+80&&player.state!=='fall'){
    player.gp=Math.max(1,player.gp-1);
    player.x=stage.pitRespawnX||80;player.y=400;
    player.vx=0;player.vy=0;player.state='idle';player.stT=0;player.inv=1.8;
    camX=Math.max(0,player.x-CW*.4);
  }
  // プレイヤー攻撃でボスを倒した場合（player.update内でhit→alive=falseになる）
  if(stage.boss&&!stage.boss.alive){gs=GS.CLEAR;clearTimer=0;stopBossBGM();return;}
  // 矢
  for(let i=player.arrows.length-1;i>=0;i--){player.arrows[i].update(stage.enemies,stage.plats);if(!player.arrows[i].alive)player.arrows.splice(i,1);}
  // 矢でボスを倒した場合
  if(stage.boss&&!stage.boss.alive){gs=GS.CLEAR;clearTimer=0;stopBossBGM();return;}
  // 敵
  for(const e of stage.enemies){
    if(!e.alive)continue;
    e.update(dt,player,stage.plats);
    if(e._dropPeel){e._dropPeel=false;peels.push(new Peel(e.x+e.w/2,e.y+e.h));}
    if(e.type==='boss'){
      for(const p of e.proj){
        if(overlapR(player.x,player.y,player.w,player.h,p.x,p.y,p.w,p.h)){
          if(p.t==='heart'&&player.inv<=0){player.confusedT=2.2;player.damage(1);}
          else if(p.t!=='heart'){player.damage(1);}
        }
      }
      for(const s of e.slamHitboxes||[]){
        if(overlapR(player.x,player.y,player.w,player.h,s.x,s.y,s.w,s.h))player.damage(1);
      }
      if(!e.alive){gs=GS.CLEAR;clearTimer=0;stopBossBGM();return;}
    }
    if(e.type!=='boss'&&e.alive&&player.inv<=0&&!player.inCar&&player.state!=='car_enter'){
      if(overlap(player,e))player.damage(1);
    }
  }

  // 画面端チェック → スクロールまたはシャッター
  checkScreenEdge();
  if(gs!==GS.PLAY&&gs!==GS.BOSS)return;

  // カメラ更新
  updateCamera(dt);

  if(player.gp<=0&&player.state==='fall'&&player.stT<=0){gs=GS.OVER;stopBossBGM();return;}
  drawScene();
}

  ctx.beginPath();ctx.arc(171,343,26,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(155,352,17,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(187,352,17,0,Math.PI*2);ctx.fill();
  // なつこさん（受付カウンター越しに上半身表示）
  {const ni=IMGS['n_idle'];const nx=Math.round(CW*.62);
  if(ni){const nh=160,nw=Math.round(ni.width/ni.height*nh);ctx.drawImage(ni,nx-Math.round(nw/2),320-nh,nw,nh);}
  else{_drawNatsuko(nx,320);}}
  // 受付カウンター（下半身を隠す）
  ctx.fillStyle='#7a9060';ctx.fillRect(120,308,CW-240,90);
  ctx.fillStyle='#9ab880';ctx.fillRect(120,308,CW-240,14);
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(124,312,CW-252,6);
}

function updateHosp(dt){
  hospTimer-=dt;
  _drawHospInterior();
  // dialogue box（画面下部）
  ctx.fillStyle='rgba(0,20,60,.93)';ctx.fillRect(40,CH-150,CW-80,140);
  ctx.strokeStyle='#88aaff';ctx.lineWidth=3;ctx.strokeRect(40,CH-150,CW-80,140);
  // portrait
  const hline=hospLines[hospIdx]||'';

  if(!hisPlayer&&IMGS['n_face']){ctx.drawImage(IMGS['n_face'],42,CH-148,52,52);}
  else{ctx.font='36px sans-serif';ctx.fillText(hisPlayer?(player.mode===1?'🦍':'🧑'):' ',44,CH-100);}
  ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';
  hline.split('\n').forEach((l,i)=>ctx.fillText(l,102,CH-118+i*42));
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='14px sans-serif';
  const isLast=hospIdx>=hospLines.length-1;
  ctx.fillText(isLast?'▼ 閉じる':'▼ 次へ',52,CH-56);
  if(hospTimer<3&&(pollJump()||pollAtk()||pollChg())){
    if(isLast){gs=GS.PLAY;}else{hospIdx++;hospTimer=4;}
  }
}

function updateTrans(dt){
  transTimer+=dt;
  if(transTimer>=TRANS_CLOSE&&!transCamDone){
    camX=stage.shutterX+80;screenAnchor=stage.shutterX+80;transCamDone=true;
  }
  drawScene();
  _drawShutterStrips(transTimer);
  if(transTimer>=TRANS_TOTAL){gs=GS.BOSS;startBossBGM();}
}

/* ── うさぎ城 入場カットシーン ── */
function _drawCastleBG(){
  // 夜空
  const sky=ctx.createLinearGradient(0,0,0,CH);
  sky.addColorStop(0,'#020410');sky.addColorStop(1,'#180830');
  ctx.fillStyle=sky;ctx.fillRect(0,0,CW,CH);
  // 星
  const stars=[[80,40],[200,90],[350,30],[500,70],[650,20],[820,55],[120,150],[900,100],[430,110],[720,140]];
  ctx.fillStyle='#ffffffcc';
  for(const[sx,sy]of stars){ctx.fillRect(sx,sy,2,2);}
  // 月
  ctx.fillStyle='#e8e0c0';ctx.beginPath();ctx.arc(820,75,38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c8c0a0';ctx.beginPath();ctx.arc(835,65,14,0,Math.PI*2);ctx.fill(); // クレーター
  // 地面
  const grd=ctx.createLinearGradient(0,440,0,CH);
  grd.addColorStop(0,'#1a0830');grd.addColorStop(1,'#0a0418');
  ctx.fillStyle=grd;ctx.fillRect(0,440,CW,CH-440);
}
function _drawCastleBuilding(){
  const ST='#3a3650',DK='#252336',LT='#524e6a',DOOR='#040812';
  function stones(x,y,w,h){
    ctx.fillStyle=ST;ctx.fillRect(x,y,w,h);
    const bh=20,bw=40;
    ctx.strokeStyle=DK;ctx.lineWidth=1;
    for(let ry=0;ry<Math.ceil(h/bh);ry++){
      const odd=ry%2,py=y+ry*bh;
      for(let rx=odd?-bw/2:0;rx<w;rx+=bw){
        const bx=x+rx,by2=py,bw2=Math.min(bw,x+w-bx-x+x),bh2=Math.min(bh,y+h-by2);
        if(bw2>0&&bh2>0)ctx.strokeRect(bx,by2,bw2,bh2);
      }
    }
  }
  function teeth(x,y,w,tw=24,gw=18){
    const tot=tw+gw;
    ctx.strokeStyle=DK;ctx.lineWidth=1;
    for(let bx=x;bx<x+w;bx+=tot){
      const cw=Math.min(tw,x+w-bx);
      ctx.fillStyle=ST;ctx.fillRect(bx,y-30,cw,30);ctx.strokeRect(bx,y-30,cw,30);
    }
  }
  // 左タワー
  stones(190,70,100,372);teeth(190,70,100,20,16);
  // 右タワー
  stones(670,70,100,372);teeth(670,70,100,20,16);
  // 本体
  stones(270,140,460,302);teeth(270,140,460,26,18);
  // タワー窓（ランプ光）
  ctx.fillStyle='#ff990088';ctx.fillRect(222,170,34,48);ctx.fillRect(222,248,34,48);
  ctx.fillStyle='#ff990088';ctx.fillRect(704,170,34,48);ctx.fillRect(704,248,34,48);
  ctx.fillStyle=LT;ctx.lineWidth=2;ctx.strokeStyle=LT;
  ctx.strokeRect(222,170,34,48);ctx.strokeRect(222,248,34,48);
  ctx.strokeRect(704,170,34,48);ctx.strokeRect(704,248,34,48);
  // ドア（アーチ型）
  const dCx=500,dTop=275,dW=130,dHRect=145;
  ctx.fillStyle=DOOR;
  ctx.fillRect(dCx-dW/2,dTop+dW/2,dW,dHRect);
  ctx.beginPath();ctx.arc(dCx,dTop+dW/2,dW/2,Math.PI,0);ctx.fill();
  ctx.strokeStyle='#7050b0';ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(dCx-dW/2,dTop+dW/2+dHRect);
  ctx.lineTo(dCx-dW/2,dTop+dW/2);
  ctx.arc(dCx,dTop+dW/2,dW/2,Math.PI,0);
  ctx.lineTo(dCx+dW/2,dTop+dW/2+dHRect);
  ctx.stroke();
  // うさぎ看板（城の正面中央）
  const sign=IMGS['castle_sign'];
  const sw2=120,sh2=120,sx2=dCx-sw2/2,sy2=dTop-sh2-14;
  ctx.fillStyle='#7050b0';ctx.lineWidth=4;ctx.strokeStyle='#cc88ff';
  ctx.fillRect(sx2-8,sy2-8,sw2+16,sh2+16);ctx.strokeRect(sx2-8,sy2-8,sw2+16,sh2+16);
  if(sign){ctx.drawImage(sign,sx2,sy2,sw2,sh2);}
  // 城名テキスト
  ctx.fillStyle='#cc88ff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
  ctx.fillText('🏰 うさぎ城',CW/2,52);ctx.textAlign='left';
}
function updateCastle(dt){
  castleT+=dt;
  _drawCastleBG();
  _drawCastleBuilding();
  // プレイヤーシルエット
  const WALK_S=0.4,WALK_E=3.0,ENTER_E=3.6;
  if(castleT>WALK_S&&castleT<ENTER_E){
    const wt=Math.min(1,(castleT-WALK_S)/(WALK_E-WALK_S));
    const charX=80+wt*390; // x=80 → x=470（ドア前）
    const charY=430;
    const entering=castleT>WALK_E;
    const alpha=entering?Math.max(0,1-(castleT-WALK_E)/(ENTER_E-WALK_E)):1;
    ctx.globalAlpha=alpha;
    const swing=entering?0:Math.sin(castleT*9)*8;
    ctx.fillStyle='#1a0840';
    // 足
    ctx.fillRect(charX-13,charY-28,11,28+Math.max(0,swing));
    ctx.fillRect(charX+2,charY-28,11,28+Math.max(0,-swing));
    // 体
    ctx.fillRect(charX-14,charY-58,28,32);
    // 頭
    ctx.beginPath();ctx.arc(charX,charY-68,15,0,Math.PI*2);ctx.fill();
    // 腕（振り）
    ctx.fillRect(charX-20,charY-52,7,18+Math.max(0,-swing/2));
    ctx.fillRect(charX+13,charY-52,7,18+Math.max(0,swing/2));
    ctx.globalAlpha=1;
  }
  // ドアが閉まるエフェクト
  if(castleT>3.1&&castleT<3.6){
    const p=Math.min(1,(castleT-3.1)/0.5);
    const dCx=500,dTop=275,dW=130,dH=220;
    ctx.fillStyle='#1a0030';
    ctx.fillRect(dCx-dW/2,dTop+dW/2,dW*p,dH); // 左扉が閉まる
    ctx.fillRect(dCx+dW/2-dW*p,dTop+dW/2,dW*p,dH); // 右扉が閉まる
  }
  // フェードイン
  if(castleT<0.4){
    ctx.fillStyle=`rgba(0,0,0,${1-castleT/0.4})`;ctx.fillRect(0,0,CW,CH);
  }
  // フェードアウト
  if(castleT>3.8){
    const f=Math.min(1,(castleT-3.8)/0.8);
    ctx.fillStyle=`rgba(0,0,0,${f})`;ctx.fillRect(0,0,CW,CH);
  }
  // STAGE 2遷移
  if(castleT>4.6){gs=GS.STAGE;stageTransTimer=0;_stageTransBuilt=false;}
}

let _goldenBuilt=false;
function _drawCutinImg(img){
  if(!img||!img.complete||!img.naturalWidth)return;
  const iw=img.naturalWidth,ih=img.naturalHeight;
  const scale=Math.max(CW/iw,CH/ih);
  const dw=iw*scale,dh=ih*scale;
  ctx.drawImage(img,(CW-dw)/2,(CH-dh)/2,dw,dh);
}
function updateGoldenCutin(dt){
  const T_FADE0=0.4,T_TEXT1=1.8,T_IMG=1.8,T_GORILLA=2.3,T_TEXT2=1.7,T_FADEOUT=0.5,T_FADEIN=0.5;
  const tA=T_FADE0;
  const tB=tA+T_TEXT1;
  const tC=tB+T_IMG;
  const tD=tC+T_IMG;
  const tE=tD+T_IMG;
  const tF=tE+T_GORILLA;
  const tG=tF+T_TEXT2;
  const tH=tG+T_FADEOUT;
  const t=goldenCutinT;
  ctx.textAlign='center';

  if(t<tA){
    drawScene();
    ctx.fillStyle='rgba(0,0,0,'+(t/tA)+')';ctx.fillRect(0,0,CW,CH);
  } else if(t<tB){
    ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
    const fade=Math.min(1,(t-tA)/0.3);
    const lines=['や、やばい、ゴリラパワーが暴走している','ゴゴ、ゴリウ、ウホホホホ','（このままでは本物のゴリラに','なってしまう）'];
    ctx.fillStyle='rgba(255,255,80,'+fade+')';ctx.font='bold 30px sans-serif';
    lines.forEach(function(ln,i){ctx.fillText(ln,CW/2,CH/2-56+i*40);});
  } else if(t<tC){
    ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
    _drawCutinImg(_cutin1);
  } else if(t<tD){
    ctx.fillStyle='#111';ctx.fillRect(0,0,CW,CH);
    _drawCutinImg(_cutin2);
  } else if(t<tE){
    ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
    _drawCutinImg(_cutin3);
  } else if(t<tF){
    ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
    _drawCutinImg(_cutinGorilla);
    const age=(t-tE)/T_GORILLA;
    if(age<0.25){
      const r=ctx.createRadialGradient(CW/2,CH/2,80,CW/2,CH/2,520);
      r.addColorStop(0,'rgba(255,0,0,0)');r.addColorStop(1,'rgba(255,0,0,'+(0.7*(1-age/0.25))+')');
      ctx.fillStyle=r;ctx.fillRect(0,0,CW,CH);
    }
  } else if(t<tG){
    ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
    const fade=Math.min(1,(t-tF)/0.35);
    ctx.fillStyle='rgba(255,50,50,'+fade+')';ctx.font='bold 56px sans-serif';
    ctx.fillText('ゲーーーン！',CW/2,CH/2-15);
    ctx.fillStyle='rgba(255,255,255,'+fade+')';ctx.font='bold 34px sans-serif';
    ctx.fillText('助けに来てくれー！',CW/2,CH/2+54);
  } else if(t<tH){
    ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
    if(!_goldenBuilt){
      stageNum=3;stage=new Stage();
      player.x=80;player.y=350;player.vx=0;player.vy=0;
      player.state='idle';player.stT=0;player.inv=0;player.arrows=[];player.powerLevel=0;
      camX=0;screenAnchor=0;scrSliding=false;scrSlideT=0;scrSlideDir=0;
      peels=[];goldenBananaItems=[];auras=[];explosions=[];hospCooldown=0;
      _goldenBuilt=true;
    }
  } else {
    drawScene();
    const fi=1-Math.min(1,(t-tH)/T_FADEIN);
    if(fi>0){ctx.fillStyle='rgba(0,0,0,'+fi+')';ctx.fillRect(0,0,CW,CH);}
    if(fi<=0){_goldenBuilt=false;gs=GS.PLAY;startBGM();}
  }
  ctx.textAlign='left';
}
function updateStageTrans(dt){
  stageTransTimer+=dt;
  const T=0.5,HOLD=1.8;
  if(stageTransTimer<T){
    drawScene();
    ctx.fillStyle=`rgba(0,0,0,${stageTransTimer/T})`;ctx.fillRect(0,0,CW,CH);
  } else {
    if(!_stageTransBuilt){
      stageNum=2;stage=new Stage();
      player.x=80;player.y=350;player.vx=0;player.vy=0;
      player.state='idle';player.stT=0;player.inv=0;player.arrows=[];
      camX=0;screenAnchor=0;scrSliding=false;peels=[];goldenBananaItems=[];auras=[];hospCooldown=0;
      _stageTransBuilt=true;
    }
    const el=stageTransTimer-T;
    if(el<HOLD){
      ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
      ctx.fillStyle='#ffd700';ctx.font='bold 68px sans-serif';ctx.textAlign='center';
      ctx.fillText('STAGE  2',CW/2,CH/2-24);
      ctx.fillStyle='#cc88ff';ctx.font='bold 28px sans-serif';
      ctx.fillText('〜ウサギ城〜',CW/2,CH/2+26);ctx.textAlign='left';
    } else {
      drawScene();
      const fi=1-Math.min(1,(el-HOLD)/T);
      if(fi>0){ctx.fillStyle=`rgba(0,0,0,${fi})`;ctx.fillRect(0,0,CW,CH);}
      if(el>=HOLD+T){gs=GS.PLAY;}
    }
  }
}
function _drawShutterStrips(t){
  for(let i=0;i<STRIPS;i++){
    const fromLeft=(i%2===0);
    let slideX;
    if(t<=TRANS_CLOSE){
      // 閉じる: 0→1
      const p=t/TRANS_CLOSE;
      const easedP=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; // ease in-out
      slideX=fromLeft?(-CW+easedP*CW):(CW-easedP*CW);
    } else if(t<=TRANS_CLOSE+TRANS_HOLD){
      // 全閉（黒）
      slideX=0;
    } else {
      // 開く: 0→1
      const p=(t-TRANS_CLOSE-TRANS_HOLD)/TRANS_OPEN;
      const easedP=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      slideX=fromLeft?(-easedP*CW):(easedP*CW);
    }
    // 帯描画
    ctx.fillStyle='#111';
    ctx.fillRect(slideX,i*STRIP_H,CW,STRIP_H+1);
    // 帯の端にハイライト（ロックマンぽいエッジ）
    ctx.fillStyle='#444';
    if(fromLeft)ctx.fillRect(slideX+CW-4,i*STRIP_H,4,STRIP_H+1);
    else ctx.fillRect(slideX,i*STRIP_H,4,STRIP_H+1);
  }
}

function drawClear(){
  drawScene();
  ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(0,0,CW,CH);
  ctx.textAlign='center';

  // ── CLEAR! タイトル ──
  const titleScale=Math.min(1,clearTimer*3);
  ctx.save();
  ctx.translate(CW/2,90);ctx.scale(titleScale,titleScale);
  ctx.fillStyle='#ffd700';ctx.font='bold 80px sans-serif';
  ctx.shadowColor='#ff8800';ctx.shadowBlur=24;
  ctx.fillText('CLEAR!',0,0);
  ctx.shadowBlur=0;
  ctx.restore();

  // ── エンディングテロップ（時間差フェードイン） ──
  const lines=[
    {t:0.6,  text:'かくして――',                              size:28, col:'#ffffff',   bold:true},
    {t:1.6,  text:'たくみは　きょうてきなる　ウサギ大王を',  size:20, col:'#ffe066',   bold:false},
    {t:2.4,  text:'みごとに　うちたおし',                    size:20, col:'#ffe066',   bold:false},
    {t:3.4,  text:'ほちょうきかいの　ぜったいはけんを',      size:20, col:'#ffccff',   bold:false},
    {t:4.2,  text:'ついに　てにいれた',                      size:20, col:'#ffccff',   bold:false},
    {t:5.4,  text:'もはや　かれに　てむかうものは　いない',  size:17, col:'rgba(255,255,255,.8)',bold:false},
    {t:6.8,  text:'ゴリラのたくみ――',                        size:26, col:'#ffd700',   bold:true},
    {t:7.6,  text:'その　でんせつが　いま　はじまる',        size:24, col:'#ffd700',   bold:true},
  ];
  lines.forEach((line,i)=>{
    if(clearTimer<line.t)return;
    const alpha=Math.min(1,(clearTimer-line.t)*2.5);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=line.col;
    ctx.font=(line.bold?'bold ':'')+line.size+'px sans-serif';
    ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=6;
    ctx.fillText(line.text,CW/2,158+i*40);
    ctx.restore();
  });

  // ── タップで戻る ──
  if(clearTimer>9){
    ctx.globalAlpha=0.5+0.5*Math.sin(clearTimer*4);
    ctx.fillStyle='#fff';ctx.font='18px sans-serif';
    ctx.fillText('タップで戻る',CW/2,CH-24);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

function drawOver(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='#ff3333';ctx.font='bold 76px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',CW/2,CH/2);
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='22px sans-serif';ctx.fillText('タップで戻る',CW/2,CH/2+60);ctx.textAlign='left';
}

init();
</script>
