<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>仮面ゴリラー</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;cursor:none!important;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;cursor:none;}
#cv{position:fixed;image-rendering:pixelated;cursor:none;}
#ctrl{position:fixed;pointer-events:none;cursor:none;}
.btn{position:absolute;pointer-events:all;border-radius:50%;border:2px solid rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:rgba(255,255,255,.9);font-family:sans-serif;-webkit-tap-highlight-color:transparent;touch-action:none;cursor:none;line-height:1.2;text-align:center;}
</style>
</head>
<body>
<canvas id="cv" width="960" height="540"></canvas>
<div id="ctrl"></div>
<script>
'use strict';
const CW=960,CH=540,GRAV=0.55,MAX_GP=6;
const SPD_H=4.5,SPD_G=4.0,JV=-13.5,JV2=-11;
const GS={TITLE:0,PLAY:1,TRANS:2,BOSS:3,HOSP:4,CLEAR:5,OVER:6,STAGE:7,CASTLE:8,GOLDEN:9};
/* ── うさぎ大王スプライト定義 (160×160セル, 6列×5行スプライトシート) ── */
const BOSS_ANIM={
  idle:  [[0,0]],
  hit:   [[2,1],[3,1]],
  down:  [[4,0],[1,1],[0,1],[5,0]],
  walk:  [[0,2],[1,2],[2,2],[3,2]],
  carrot:[[0,0],[2,0],[5,1],[5,1]],
  slam:  [[0,4],[1,4],[2,0],[1,0]],
  heart: [[0,3],[1,3],[2,3]],
};
const BOSS_FDR={idle:.55,hit:.18,down:.32,walk:.14,carrot:.14,slam:.22,heart:.2};
const BS=160;

/* ── キャンバス ── */
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
let scale=1;
const isTouch=('ontouchstart' in window);
function resize(){
  const W=window.innerWidth,H=window.innerHeight;
  const portrait=H>W;
  const SIDE=(!isTouch)?0:portrait?0:160;  // 横向き：左右160px、縦向き：0
  const BOT =(!isTouch)?0:portrait?150:0;  // 縦向き：下150px、横向き：0
  scale=Math.min((W-SIDE*2)/CW,(H-BOT)/CH);
  const cw=CW*scale|0,ch=CH*scale|0;
  const lx=SIDE||((W-cw)/2|0);
  const ty=(H-BOT-ch)/2|0;
  cv.style.cssText=`position:fixed;left:${lx}px;top:${ty}px;width:${cw}px;height:${ch}px;`;
  const ctrl=document.getElementById('ctrl');
  ctrl.style.cssText=`position:fixed;left:0;top:0;width:${W}px;height:${H}px;pointer-events:none;cursor:none;visibility:${_ctrlVisible?'visible':'hidden'};`;
  window._ctrlLayout={W,H,portrait,SIDE,BOT,cw,ch,lx,ty};
  buildCtrl();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,300));

/* ── タッチボタン ── */
const BTN={L:0,R:0,jump:0,atk:0,chg:0};
function buildCtrl(){
  const ctrl=document.getElementById('ctrl');
  ctrl.innerHTML='';
  if(!isTouch)return;
  const {W,H,portrait,SIDE,BOT,cw,ch,lx,ty}=window._ctrlLayout||{};
  if(!W)return;

  function mk(prop,label,style){
    const pad=22,pxv=s=>parseInt(s)||0;
    // 外側：透明なヒットエリア（見た目より大きい）
    const hit=document.createElement('div');
    hit.dataset.prop=prop;
    hit.style.cssText=`position:absolute;left:${p(pxv(style.left)-pad)};top:${p(pxv(style.top)-pad)};width:${p(pxv(style.width)+pad*2)};height:${p(pxv(style.height)+pad*2)};cursor:none;touch-action:none;pointer-events:auto;-webkit-tap-highlight-color:transparent;`;
    // 内側：実際に見えるボタン
    const d=document.createElement('div');
    d.className='btn';d.innerHTML=label;
    d.style.cssText=`position:absolute;left:${p(pad)};top:${p(pad)};width:${style.width};height:${style.height};background:${style.background};font-size:${style.fontSize};pointer-events:none;`;
    hit.appendChild(d);
    hit.addEventListener('touchstart',e=>{e.preventDefault();BTN[prop]=1;},{passive:false});
    hit.addEventListener('touchend',  e=>{e.preventDefault();_updateBTN(e.touches);},{passive:false});
    hit.addEventListener('touchcancel',()=>{BTN[prop]=0;});
    ctrl.appendChild(hit);
  }
  const p=v=>Math.round(v)+'px';

  if(portrait){
    // 縦向き：ボタンサイズを画面幅に合わせて小さく
    const bsz=Math.min(Math.round(W*0.17),72);
    const smSz=Math.round(bsz*0.78);
    const gap=Math.round(W*0.04);
    const vt=H-BOT+Math.round((BOT-bsz)/2); // 帯内垂直中央

    // 左グループ：◀ と ▶ を左端から順に配置
    const lL=Math.round(W*0.04);
    const lR=lL+bsz+gap;

    // 右グループ：ジャンプを右端、こうげきをその左
    const jL=Math.round(W*0.96)-bsz;
    const aL=jL-gap-bsz;

    // へんしん：左右グループの中間・上に浮かせる
    const chgCx=Math.round((lR+bsz+aL)/2);
    const chgL=chgCx-Math.round(smSz/2);
    const chgT=H-BOT-smSz-Math.round(BOT*0.4);

    mk('L','◀',         {left:p(lL),  top:p(vt),  width:p(bsz),  height:p(bsz),  background:'rgba(255,255,255,.22)',fontSize:p(bsz*.35)});
    mk('R','▶',         {left:p(lR+8),top:p(vt),  width:p(bsz),  height:p(bsz),  background:'rgba(255,255,255,.22)',fontSize:p(bsz*.35)});
    mk('atk','こう<br>げき',{left:p(aL),top:p(vt),  width:p(bsz),  height:p(bsz),  background:'rgba(220,40,40,.28)', fontSize:p(bsz*.18)});
    mk('jump','ジャンプ',   {left:p(jL),top:p(vt),  width:p(bsz),  height:p(bsz),  background:'rgba(40,200,60,.28)', fontSize:p(bsz*.18)});
    mk('chg','へん<br>しん',{left:p(chgL),top:p(chgT),width:p(smSz),height:p(smSz),background:'rgba(60,60,220,.28)', fontSize:p(smSz*.17)});
  } else {
    // 横向き：左右160px帯
    const lBsz=Math.min(SIDE-24,88);           // 左ボタンサイズ
    const lMg=Math.round((SIDE-lBsz)/2);
    const cBot=ty+ch;
    const lBot=cBot-lBsz-14;
    const lGap=Math.round(lBsz*.22);
    // 左エリア：◀（上）▶（下）
    mk('L','◀',{left:p(lMg),top:p(lBot-lBsz-lGap),width:p(lBsz),height:p(lBsz),background:'rgba(255,255,255,.22)',fontSize:p(lBsz*.35)});
    mk('R','▶',{left:p(lMg+8),top:p(lBot),         width:p(lBsz),height:p(lBsz),background:'rgba(255,255,255,.22)',fontSize:p(lBsz*.35)});
    // 右エリア：こうげき（上）ジャンプ（下）を右寄せ、へんしんを左・中間
    const rBsz=62;
    const chSz=52;
    const rGap=Math.round(rBsz*.55);           // atk と jump の間隔を広めに
    const rBot=cBot-rBsz-14;
    const atkL=W-rBsz-10;                      // 右端から10px
    const chgL=atkL-chSz-12;                   // こうげきの左に12px空けて配置
    const chgT=Math.round(rBot-rGap/2-chSz/2); // atk と jump の中間に縦配置
    mk('atk','こう<br>げき',{left:p(atkL),top:p(rBot-rBsz-rGap),width:p(rBsz),height:p(rBsz),background:'rgba(220,40,40,.28)',fontSize:p(rBsz*.18)});
    mk('jump','ジャンプ',   {left:p(atkL),top:p(rBot),           width:p(rBsz),height:p(rBsz),background:'rgba(40,200,60,.28)', fontSize:p(rBsz*.18)});
    mk('chg','へん<br>しん',{left:p(chgL),top:p(chgT),           width:p(chSz),height:p(chSz),background:'rgba(60,60,220,.32)', fontSize:p(chSz*.17)});
  }
}

/* ── タッチボタン：スライド対応（touchmoveのみグローバル） ── */
function _updateBTN(touches){
  Object.keys(BTN).forEach(k=>BTN[k]=0);
  for(let i=0;i<touches.length;i++){
    const t=touches[i];
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const hit=el&&el.closest('[data-prop]');
    if(hit)BTN[hit.dataset.prop]=1;
  }
}
// touchmoveのみドキュメントレベルで監視（指スライド対応）
document.addEventListener('touchmove',e=>{e.preventDefault();_updateBTN(e.touches);},{passive:false});

/* ── キーボード ── */
const KEY={};
document.addEventListener('keydown',e=>{KEY[e.code]=1;});
document.addEventListener('keyup', e=>{KEY[e.code]=0;});
function isL(){return KEY['ArrowLeft']||KEY['KeyA']||BTN.L;}
function isR(){return KEY['ArrowRight']||KEY['KeyD']||BTN.R;}
let _pj=0,_pa=0,_pc=0;
function pollJump(){const v=KEY['ArrowUp']||KEY['KeyW']||KEY['KeyZ']||BTN.jump;if(v&&!_pj){_pj=1;return 1;}if(!v)_pj=0;return 0;}
function pollAtk(){const v=KEY['KeyX']||KEY['Space']||BTN.atk;if(v&&!_pa){_pa=1;return 1;}if(!v)_pa=0;return 0;}
function pollChg(){const v=KEY['KeyC']||BTN.chg;if(v&&!_pc){_pc=1;return 1;}if(!v)_pc=0;return 0;}

/* ── 効果音 ── */
let _AC=null;
function _ac(){if(!_AC)_AC=new(window.AudioContext||window.webkitAudioContext)();if(_AC.state==='suspended')_AC.resume();return _AC;}
function playZkyun(){
  try{
    const ac=_ac(),t=ac.currentTime;
    // ── メイン：ズ→キューン（鋸波、低→高→低）──
    const o1=ac.createOscillator(),g1=ac.createGain();
    o1.connect(g1);g1.connect(ac.destination);
    o1.type='sawtooth';
    o1.frequency.setValueAtTime(140,t);
    o1.frequency.linearRampToValueAtTime(1600,t+.09);
    o1.frequency.exponentialRampToValueAtTime(90,t+.38);
    g1.gain.setValueAtTime(0,t);
    g1.gain.linearRampToValueAtTime(.38,t+.02);
    g1.gain.exponentialRampToValueAtTime(.001,t+.40);
    o1.start(t);o1.stop(t+.42);
    // ── 高音キラキラ（サイン波） ──
    const o2=ac.createOscillator(),g2=ac.createGain();
    o2.connect(g2);g2.connect(ac.destination);
    o2.type='sine';
    o2.frequency.setValueAtTime(1800,t+.07);
    o2.frequency.exponentialRampToValueAtTime(280,t+.38);
    g2.gain.setValueAtTime(0,t+.06);
    g2.gain.linearRampToValueAtTime(.22,t+.12);
    g2.gain.exponentialRampToValueAtTime(.001,t+.40);
    o2.start(t+.06);o2.stop(t+.42);
    // ── ノイズバースト（ズ の頭） ──
    const buf=ac.createBuffer(1,ac.sampleRate*.04,ac.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(),g3=ac.createGain();
    src.buffer=buf;src.connect(g3);g3.connect(ac.destination);
    g3.gain.setValueAtTime(.18,t);g3.gain.exponentialRampToValueAtTime(.001,t+.04);
    src.start(t);
  }catch(e){}
}

function playHenshinVoice(){
  // ── 低音ドーン強化版 ──
  try{
    const ac=_ac(),t=ac.currentTime;
    const comp=ac.createDynamicsCompressor();
    comp.threshold.value=-6;comp.ratio.value=8;comp.attack.value=0.003;comp.release.value=0.1;
    comp.connect(ac.destination);
    // ズシン低音①（超低音）
    const o1=ac.createOscillator(),g1=ac.createGain();
    o1.connect(g1);g1.connect(comp);
    o1.type='sine';
    o1.frequency.setValueAtTime(80,t);
    o1.frequency.exponentialRampToValueAtTime(28,t+0.5);
    g1.gain.setValueAtTime(0,t);g1.gain.linearRampToValueAtTime(2.8,t+0.02);
    g1.gain.exponentialRampToValueAtTime(0.001,t+0.9);
    o1.start(t);o1.stop(t+0.92);
    // ズシン低音②（胴鳴り）
    const o2=ac.createOscillator(),g2=ac.createGain();
    o2.connect(g2);g2.connect(comp);
    o2.type='triangle';
    o2.frequency.setValueAtTime(160,t);
    o2.frequency.exponentialRampToValueAtTime(55,t+0.4);
    g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(1.4,t+0.02);
    g2.gain.exponentialRampToValueAtTime(0.001,t+0.6);
    o2.start(t);o2.stop(t+0.62);
    // 打撃ノイズ（頭の「バン」）
    const buf=ac.createBuffer(1,ac.sampleRate*0.08,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
    const ns=ac.createBufferSource(),ng=ac.createGain();
    ns.buffer=buf;ns.connect(ng);ng.connect(comp);
    ng.gain.setValueAtTime(1.8,t);ng.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    ns.start(t);
    // 残響ノイズ（声の後ろに広がる）
    const buf2=ac.createBuffer(1,ac.sampleRate*0.8,ac.sampleRate);
    const d2=buf2.getChannelData(0);
    for(let i=0;i<d2.length;i++)d2[i]=(Math.random()*2-1)*Math.pow(1-i/d2.length,2.5)*0.4;
    const ns2=ac.createBufferSource(),ng2=ac.createGain();
    ns2.buffer=buf2;ns2.connect(ng2);ng2.connect(comp);
    ng2.gain.setValueAtTime(0.7,t+0.05);ng2.gain.exponentialRampToValueAtTime(0.001,t+0.8);
    ns2.start(t+0.05);
  }catch(e){}
  // ── 音声合成 ──
  try{
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const fire=()=>{
      try{
        const vs=window.speechSynthesis.getVoices();
        const u=new SpeechSynthesisUtterance('へんしん！');
        u.lang='ja-JP';u.pitch=0;u.rate=0.6;u.volume=1.0;
        const mPick=vs.find(v=>v.lang.startsWith('ja')&&/otoya|keita|男|male/i.test(v.name))
                   ||vs.find(v=>v.lang.startsWith('ja')&&!/(kyoko|haruka|女|female)/i.test(v.name))
                   ||vs.find(v=>v.lang.startsWith('ja'));
        if(mPick)u.voice=mPick;
        window.speechSynthesis.speak(u);
      }catch(e){}
    };
    if(window.speechSynthesis.getVoices().length>0)fire();
    else window.speechSynthesis.onvoiceschanged=()=>{try{fire();}catch(e){}window.speechSynthesis.onvoiceschanged=null;};
  }catch(e){}
}

function playExplosion(){
  try{
    const ac=_ac(),t=ac.currentTime;
    // ノイズバースト（ドン）
    const len=Math.ceil(ac.sampleRate*.18);
    const buf=ac.createBuffer(1,len,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);
    const src=ac.createBufferSource(),g=ac.createGain(),lp=ac.createBiquadFilter();
    src.buffer=buf;lp.type='lowpass';lp.frequency.value=1200;
    g.gain.setValueAtTime(1.0,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
    src.connect(lp);lp.connect(g);g.connect(ac.destination);
    src.start(t);src.stop(t+.2);
    // 低音ドーン
    const o=ac.createOscillator(),og=ac.createGain();
    o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(30,t+.15);
    og.gain.setValueAtTime(.6,t);og.gain.exponentialRampToValueAtTime(.001,t+.18);
    o.connect(og);og.connect(ac.destination);o.start(t);o.stop(t+.2);
  }catch(e){}
}

/* ── BGM ── */
let _bgmOn=false,_bgmTid=null,_bgmGain=null;
function _getBgmDst(){
  const ac=_ac();
  if(!_bgmGain){_bgmGain=ac.createGain();_bgmGain.gain.value=1;_bgmGain.connect(ac.destination);}
  return _bgmGain;
}
function startBGM(){
  if(_bgmOn)return;_bgmOn=true;
  const g=_getBgmDst(),t=_ac().currentTime;
  g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(1,t);
  _bgmLoop();
}
function stopBGM(){
  _bgmOn=false;if(_bgmTid)clearTimeout(_bgmTid);_bgmTid=null;
  if(_bgmGain){const t=_ac().currentTime;_bgmGain.gain.cancelScheduledValues(t);_bgmGain.gain.setValueAtTime(1,t);_bgmGain.gain.exponentialRampToValueAtTime(0.001,t+0.25);}
}
function _bgmLoop(){
  if(!_bgmOn)return;
  try{
    const ac=_ac(),t=ac.currentTime+0.05;
    const dst=_getBgmDst();
    const bpm=158,bt=60/bpm,bar=bt*4;
    const tone=(f,s,d,tp,v)=>{try{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=tp||'square';o.frequency.value=f;
      g.gain.setValueAtTime(v||.07,t+s);
      g.gain.setValueAtTime((v||.07)*.6,t+s+d*.65);
      g.gain.exponentialRampToValueAtTime(.001,t+s+d);
      o.connect(g);g.connect(dst);
      o.start(t+s);o.stop(t+s+d+.02);
    }catch(e){}};
    const kick=(s)=>{try{
      const o=ac.createOscillator(),g=ac.createGain();
      o.frequency.setValueAtTime(200,t+s);o.frequency.exponentialRampToValueAtTime(38,t+s+.15);
      g.gain.setValueAtTime(.65,t+s);g.gain.exponentialRampToValueAtTime(.001,t+s+.22);
      o.connect(g);g.connect(dst);o.start(t+s);o.stop(t+s+.25);
    }catch(e){}};
    const snr=(s)=>{try{
      const len=Math.ceil(ac.sampleRate*.07),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const src=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
      src.buffer=b;f.type='bandpass';f.frequency.value=2500;f.Q.value=.7;
      g.gain.setValueAtTime(.22,t+s);g.gain.exponentialRampToValueAtTime(.001,t+s+.07);
      src.connect(f);f.connect(g);g.connect(dst);src.start(t+s);src.stop(t+s+.1);
    }catch(e){}};
    const hat=(s,v)=>{try{
      const len=Math.ceil(ac.sampleRate*.022),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const src=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
      src.buffer=b;f.type='highpass';f.frequency.value=9000;
      g.gain.setValueAtTime(v||.05,t+s);g.gain.exponentialRampToValueAtTime(.001,t+s+.022);
      src.connect(f);f.connect(g);g.connect(dst);src.start(t+s);src.stop(t+s+.03);
    }catch(e){}};
    const C3=130.81,F3=174.61,G3=196,A3=220,B3=246.94;
    const C4=261.63,D4=293.66,E4=329.63,F4=349.23,G4=392,A4=440,B4=493.88;
    const C5=523.25,D5=587.33,E5=659.25,G5=783.99;
    const BARS=4,LD=bar*BARS;
    // メロディ
    [[E5,0,bt*.42],[G5,bt*.5,bt*.42],[E5,bt,bt*.42],[C5,bt*1.5,bt*.42],
     [D5,bt*2,bt*.42],[E5,bt*2.5,bt*.42],[G5,bt*3,bt*.88],
     [A4,bar,bt*.42],[C5,bar+bt*.5,bt*.42],[E5,bar+bt,bt*.42],[C5,bar+bt*1.5,bt*.42],
     [A4,bar+bt*2,bt*.42],[G4,bar+bt*2.5,bt*.42],[A4,bar+bt*3,bt*.42],[C5,bar+bt*3.5,bt*.42],
     [F4,bar*2,bt*.42],[A4,bar*2+bt*.5,bt*.42],[C5,bar*2+bt,bt*.42],[A4,bar*2+bt*1.5,bt*.42],
     [C5,bar*2+bt*2,bt*.42],[D5,bar*2+bt*2.5,bt*.42],[C5,bar*2+bt*3,bt*.42],[A4,bar*2+bt*3.5,bt*.42],
     [G4,bar*3,bt*.42],[B4,bar*3+bt*.5,bt*.42],[D5,bar*3+bt,bt*.42],[G5,bar*3+bt*1.5,bt*.42],
     [E5,bar*3+bt*2,bt*.88],[D5,bar*3+bt*3,bt*.42],[C5,bar*3+bt*3.5,bt*.42],
    ].forEach(([f,s,d])=>tone(f,s,d,'square',.07));
    // ベース
    [[C3,0],[A3,bar],[F3,bar*2],[G3,bar*3]].forEach(([f,s])=>{
      for(let i=0;i<4;i++)tone(f,s+i*bt,bt*.5,'sawtooth',.11);
    });
    // コードパッド
    [[C4,E4,G4],[A3,C4,E4],[F3,A3,C4],[G3,B3,D4]].forEach((fqs,bi)=>
      fqs.forEach(f=>tone(f,bar*bi,bar*.92,'triangle',.028)));
    // ドラム
    for(let b=0;b<BARS;b++){
      const o=bar*b;
      kick(o);kick(o+bt*2);
      snr(o+bt);snr(o+bt*3);
      for(let h=0;h<8;h++)hat(o+h*bt*.5,h%2?0.04:0.065);
    }
    _bgmTid=setTimeout(()=>{if(_bgmOn)_bgmLoop();},(LD-.18)*1000);
  }catch(e){_bgmTid=setTimeout(()=>{if(_bgmOn)_bgmLoop();},2500);}
}

/* ── ボス戦BGM（Dマイナー・BPM180） ── */
let _bossBGMOn=false,_bossBGMTid=null,_bossGain=null;
function _getBossGainDst(){
  const ac=_ac();
  if(!_bossGain){_bossGain=ac.createGain();_bossGain.gain.value=1;_bossGain.connect(ac.destination);}
  return _bossGain;
}
function startBossBGM(){
  if(_bossBGMOn)return;_bossBGMOn=true;stopBGM();
  const g=_getBossGainDst(),t=_ac().currentTime;
  g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(1,t);
  _bossBGMLoop();
}
function stopBossBGM(){
  _bossBGMOn=false;if(_bossBGMTid)clearTimeout(_bossBGMTid);_bossBGMTid=null;
  if(_bossGain){const t=_ac().currentTime;_bossGain.gain.cancelScheduledValues(t);_bossGain.gain.setValueAtTime(1,t);_bossGain.gain.exponentialRampToValueAtTime(0.001,t+0.25);}
}
function _bossBGMLoop(){
  if(!_bossBGMOn)return;
  try{
    const ac=_ac(),t=ac.currentTime+0.05;
    const dst=_getBossGainDst();
    const bpm=180,bt=60/bpm,bar=bt*4;
    const tone=(f,s,d,tp,v)=>{try{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=tp||'square';o.frequency.value=f;
      g.gain.setValueAtTime(v||.07,t+s);
      g.gain.setValueAtTime((v||.07)*.45,t+s+d*.55);
      g.gain.exponentialRampToValueAtTime(.001,t+s+d);
      o.connect(g);g.connect(dst);o.start(t+s);o.stop(t+s+d+.02);
    }catch(e){}};
    const kick=(s,v)=>{try{
      const o=ac.createOscillator(),g=ac.createGain();
      o.frequency.setValueAtTime(220,t+s);o.frequency.exponentialRampToValueAtTime(35,t+s+.12);
      g.gain.setValueAtTime(v||.85,t+s);g.gain.exponentialRampToValueAtTime(.001,t+s+.18);
      o.connect(g);g.connect(dst);o.start(t+s);o.stop(t+s+.22);
    }catch(e){}};
    const snr=(s,v)=>{try{
      const len=Math.ceil(ac.sampleRate*.09),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const src=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
      src.buffer=b;f.type='bandpass';f.frequency.value=2800;f.Q.value=.6;
      g.gain.setValueAtTime(v||.3,t+s);g.gain.exponentialRampToValueAtTime(.001,t+s+.09);
      src.connect(f);f.connect(g);g.connect(dst);src.start(t+s);src.stop(t+s+.12);
    }catch(e){}};
    const hat=(s,v)=>{try{
      const len=Math.ceil(ac.sampleRate*.016),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const src=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
      src.buffer=b;f.type='highpass';f.frequency.value=10000;
      g.gain.setValueAtTime(v||.06,t+s);g.gain.exponentialRampToValueAtTime(.001,t+s+.016);
      src.connect(f);f.connect(g);g.connect(dst);src.start(t+s);src.stop(t+s+.022);
    }catch(e){}};
    const D3=146.83,F3=174.61,G3=196,A3=220,C4=261.63;
    const D4=293.66,F4=349.23,G4=392,A4=440,Bb4=466.16,C5=523.25,D5=587.33;
    const BARS=2,LD=bar*BARS;
    // メロディ：Dマイナー降下→反復（緊張感）
    [[D5,0,bt*.42],[C5,bt*.5,bt*.42],[Bb4,bt,bt*.42],[A4,bt*1.5,bt*.42],
     [G4,bt*2,bt*.42],[A4,bt*2.5,bt*.42],[C5,bt*3,bt*.42],[D5,bt*3.5,bt*.42],
     [D5,bar,bt*.88],[A4,bar+bt*1,bt*.42],[C5,bar+bt*1.5,bt*.42],
     [A4,bar+bt*2,bt*.42],[G4,bar+bt*2.5,bt*.42],[F4,bar+bt*3,bt*.42],[A4,bar+bt*3.5,bt*.88],
    ].forEach(([f,s,d])=>tone(f,s,d,'square',.09));
    // ベース：力強いDマイナー
    [[D3,0,bt*.4],[A3,bt*.5,bt*.35],[D3,bt,bt*.4],[C4,bt*1.5,bt*.35],
     [A3,bt*2,bt*.4],[G3,bt*2.5,bt*.35],[F3,bt*3,bt*.4],[A3,bt*3.5,bt*.35],
     [D3,bar,bt*.8],[A3,bar+bt,bt*.4],[G3,bar+bt*1.5,bt*.35],
     [F3,bar+bt*2,bt*.4],[A3,bar+bt*2.5,bt*.35],[C4,bar+bt*3,bt*.4],[A3,bar+bt*3.5,bt*.35],
    ].forEach(([f,s,d])=>tone(f,s,d,'sawtooth',.15));
    // コードスタブ（dm和音・緊迫）
    [[D4,F4,A4],[G3,Bb4,D4]].forEach((fqs,bi)=>{
      [0,bt*2].forEach(os=>fqs.forEach(f=>tone(f,bar*bi+os+bt*.1,bt*.2,'sawtooth',.04)));
    });
    // ドラム：シンコペーション
    for(let b=0;b<BARS;b++){
      const o=bar*b;
      kick(o,.9);kick(o+bt*.75,.55);kick(o+bt*2,.9);kick(o+bt*2.5,.6);
      snr(o+bt,.32);snr(o+bt*3,.32);snr(o+bt*3.5,.18);
      for(let h=0;h<16;h++)hat(o+h*bt*.25,h%4===0?.08:.05);
    }
    _bossBGMTid=setTimeout(()=>{if(_bossBGMOn)_bossBGMLoop();},(LD-.18)*1000);
  }catch(e){_bossBGMTid=setTimeout(()=>{if(_bossBGMOn)_bossBGMLoop();},2500);}
}

function loadImg(name,src){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      try{
        const oc=document.createElement('canvas');
        oc.width=im.width;oc.height=im.height;
        const ox=oc.getContext('2d');ox.drawImage(im,0,0);
        const id=ox.getImageData(0,0,oc.width,oc.height),d=id.data;

        const ox=oc.getContext('2d');ox.drawImage(im,0,0);
        const id=ox.getImageData(0,0,oc.width,oc.height),d=id.data;
        const W=oc.width,H=oc.height;
        // 端から繋がった白背景だけ除去（BFS）
        const vis=new Uint8Array(W*H);
        const q=[];
        for(let x=0;x<W;x++){q.push(x,W*(H-1)+x);}
        for(let y=1;y<H-1;y++){q.push(y*W,y*W+W-1);}
        let qi=0;
        while(qi<q.length){
          const idx=q[qi++];if(vis[idx])continue;vis[idx]=1;
          const p=idx*4;
          if(d[p]>230&&d[p+1]>230&&d[p+2]>230){
            d[p+3]=0;
            const x=idx%W,y=(idx/W)|0;
            if(x>0)q.push(idx-1);if(x<W-1)q.push(idx+1);
            if(y>0)q.push(idx-W);if(y<H-1)q.push(idx+W);
          }
        }
        ox.putImageData(id,0,0);PIMGS[key]=oc;
      }catch(e){PIMGS[key]=im;}
      if(++done===list.length)pimgsReady=true;
    };

    im.src=src;
  });
}
