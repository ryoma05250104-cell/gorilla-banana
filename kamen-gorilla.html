<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>仮面ゴリラー</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;cursor:none;}
#cv{position:fixed;image-rendering:pixelated;cursor:none;}
#ctrl{position:fixed;pointer-events:none;}
.btn{position:absolute;pointer-events:all;border-radius:50%;border:3px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-family:sans-serif;-webkit-tap-highlight-color:transparent;touch-action:none;}
</style>
</head>
<body>
<canvas id="cv" width="960" height="540"></canvas>
<div id="ctrl"></div>
<script>
'use strict';
const CW=960,CH=540,GRAV=0.55,MAX_GP=3;
const SPD_H=4.5,SPD_G=4.0,JV=-13.5,JV2=-11;
const GS={TITLE:0,PLAY:1,TRANS:2,BOSS:3,HOSP:4,CLEAR:5,OVER:6};

/* ── キャンバス ── */
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
let scale=1;
function resize(){
  const W=window.innerWidth,H=window.innerHeight;
  scale=Math.min(W/CW,H/CH);
  const cw=CW*scale|0,ch=CH*scale|0;
  const lx=(W-cw)/2|0,ty=(H-ch)/2|0;
  cv.style.cssText=`position:fixed;left:${lx}px;top:${ty}px;width:${cw}px;height:${ch}px;`;
  document.getElementById('ctrl').style.cssText=`position:fixed;left:${lx}px;top:${ty}px;width:${cw}px;height:${ch}px;pointer-events:none;`;
  buildCtrl();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,300));

/* ── タッチボタン ── */
const BTN={L:0,R:0,jump:0,atk:0,chg:0};
function buildCtrl(){
  const ctrl=document.getElementById('ctrl');
  ctrl.innerHTML='';
  const s=Math.min(scale,1.6);
  function mk(prop,label,style){
    const d=document.createElement('div');
    d.className='btn';d.textContent=label;
    Object.assign(d.style,style);
    d.addEventListener('touchstart',e=>{e.preventDefault();BTN[prop]=1;},{passive:false});
    d.addEventListener('touchend',  e=>{e.preventDefault();BTN[prop]=0;},{passive:false});
    d.addEventListener('touchcancel',()=>{BTN[prop]=0;});
    ctrl.appendChild(d);
  }
  const b=Math.round(14*s),ls=Math.round(10*s),rs=Math.round(10*s);
  const sz=v=>Math.round(v*s)+'px';
  mk('L','◀',{bottom:b+'px',left:ls+'px',width:sz(88),height:sz(88),background:'rgba(255,255,255,.13)',fontSize:'30px'});
  mk('R','▶',{bottom:b+'px',left:(ls+Math.round(100*s))+'px',width:sz(88),height:sz(88),background:'rgba(255,255,255,.13)',fontSize:'30px'});
  mk('jump','↑',{bottom:b+'px',right:rs+'px',width:sz(92),height:sz(92),background:'rgba(40,200,60,.55)',fontSize:'32px'});
  mk('chg','変',{bottom:(b+Math.round(104*s))+'px',right:(rs+Math.round(100*s))+'px',width:sz(76),height:sz(76),background:'rgba(60,60,220,.55)',fontSize:'16px'});
  mk('atk','攻',{bottom:b+'px',right:(rs+Math.round(104*s))+'px',width:sz(76),height:sz(76),background:'rgba(220,40,40,.55)',fontSize:'16px'});
}

/* ── キーボード ── */
const KEY={};
document.addEventListener('keydown',e=>{KEY[e.code]=1;});
document.addEventListener('keyup', e=>{KEY[e.code]=0;});
function isL(){return KEY['ArrowLeft']||KEY['KeyA']||BTN.L;}
function isR(){return KEY['ArrowRight']||KEY['KeyD']||BTN.R;}
let _pj=0,_pa=0,_pc=0;
function pollJump(){const v=KEY['ArrowUp']||KEY['KeyW']||KEY['KeyZ']||BTN.jump;if(v&&!_pj){_pj=1;return 1;}if(!v)_pj=0;return 0;}
function pollAtk(){const v=KEY['KeyX']||KEY['Space']||BTN.atk;if(v&&!_pa){_pa=1;return 1;}if(!v)_pa=0;return 0;}
function pollChg(){const v=KEY['KeyC']||BTN.chg;if(v&&!_pc){_pc=1;return 1;}if(!v)_pc=0;return 0;}

/* ── 画像ロード（白背景透過） ── */
const IMGS={};
function loadImg(name,src){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      try{
        const oc=document.createElement('canvas');
        oc.width=im.width;oc.height=im.height;
        const ox=oc.getContext('2d');ox.drawImage(im,0,0);
        const id=ox.getImageData(0,0,oc.width,oc.height),d=id.data;
        for(let i=0;i<d.length;i+=4)if(d[i]>230&&d[i+1]>230&&d[i+2]>230)d[i+3]=0;
        ox.putImageData(id,0,0);IMGS[name]=oc;
      }catch(e){IMGS[name]=im;}
      res();
    };
    im.onerror=()=>{IMGS[name]=null;res();};
    im.src=src;
  });
}

/* ── 人間モード個別フレーム ── */
const HFRS={idle:null,walk:null,run:null,jump:null};
let hfrsReady=false;
function loadHumanFrames(){
  const list=[['idle','assets/player/idle.png'],['walk','assets/player/walk.png'],
              ['run','assets/player/run.png'],['jump','assets/player/jump.png']];
  let done=0;
  list.forEach(([key,src])=>{
    const im=new Image();
    im.onload=()=>{
      try{
        const oc=document.createElement('canvas');oc.width=im.width;oc.height=im.height;
        const ox=oc.getContext('2d');ox.drawImage(im,0,0);
        const id=ox.getImageData(0,0,oc.width,oc.height),d=id.data;
        for(let i=0;i<d.length;i+=4)if(d[i]>230&&d[i+1]>230&&d[i+2]>230)d[i+3]=0;
        ox.putImageData(id,0,0);HFRS[key]=oc;
      }catch(e){HFRS[key]=im;}
      if(++done===list.length)hfrsReady=true;
    };
    im.onerror=()=>{if(++done===list.length)hfrsReady=true;};
    im.src=src;
  });
}

/* ── アニメ用画像（弓矢・車乗り込み） ── */
const HIMGS={bow1:null,bow2:null,bow3:null,bow4:null,arrow:null,car1:null,car2:null,car3:null};
let hiReady=false;
function loadHumanAnim(){
  const list=[
    ['bow1','assets/player/human/bow_1_draw.png'],
    ['bow2','assets/player/human/bow_2_aim.png'],
    ['bow3','assets/player/human/bow_3_fulldraw.png'],
    ['bow4','assets/player/human/bow_4_recoil.png'],
    ['arrow','assets/player/human/arrow_flying.png'],
    ['car1','assets/player/human/car_1_stand_beside.png'],
    ['car2','assets/player/human/car_2_getting_in.png'],
    ['car3','assets/player/human/car_3_seated.png'],
  ];
  let done=0;
  list.forEach(([key,src])=>{
    const im=new Image();
    im.onload=()=>{HIMGS[key]=im;if(++done===list.length)hiReady=true;};
    im.onerror=()=>{if(++done===list.length)hiReady=true;};
    im.src=src;
  });
}

/* ── スプライト座標
  human.png / gorilla.png (1536×1024, 白背景)
  行1 y=40 sh=155: あるく×3  はしる×4  ジャンプ×2
  行2 y=248 sh=145: ダメージ×3  たおれ  立ち×2  しゃがむ
  human2.png (IMG_1503, 1536×1024, 黒ラベル)
  行1 y=30 sh=148: 移動×4  はしる×4  ジャンプ×3
  行2 y=200 sh=143: パンチ×3  キック×2  弓矢×2+矢
  行5 y=660 sh=200: ベンツ乗る×3  走行×3
── */
function fr(sx,sy,sw,sh){return{sx,sy,sw,sh};}
const SW=106,SH=155;
const SP={
  H:{
    walk:[fr(135,40,SW,SH),fr(248,40,SW,SH),fr(361,40,SW,SH)],
    run: [fr(572,40,SW,SH),fr(685,40,SW,SH),fr(798,40,SW,SH),fr(911,40,SW,SH)],
    jump:[fr(1190,40,SW,SH),fr(1303,40,SW,SH)],
    idle:[fr(910,248,SW,145),fr(1023,248,SW,145)],
    dmg: [fr(245,248,SW,145),fr(358,248,SW,145),fr(471,248,SW,145)],
    fall:[fr(577,268,165,95)],
    bow: [fr(905,200,128,143),fr(1040,200,128,143)],  // human2
    carD:[fr(1000,660,175,200),fr(1180,660,175,200),fr(1360,660,175,200)],
  },
  G:{
    walk:[fr(135,40,SW,SH),fr(248,40,SW,SH),fr(361,40,SW,SH)],
    run: [fr(572,40,SW,SH),fr(685,40,SW,SH),fr(798,40,SW,SH),fr(911,40,SW,SH)],
    jump:[fr(1190,40,SW,SH)],
    jump2:[fr(1303,40,SW,SH)],
    idle:[fr(910,248,SW,145),fr(1023,248,SW,145)],
    punch:[fr(245,248,SW,145),fr(358,248,SW,145)],
    dmg: [fr(471,248,SW,145)],
    fall:[fr(577,268,165,95)],
  },
};

/* ── アニメ ── */
class Anim{
  constructor(frames,fps=10){this.frames=frames;this.fps=fps;this.t=0;this.i=0;}
  tick(dt){if(this.frames.length<2)return;this.t+=dt;if(this.t>=1/this.fps){this.t=0;this.i=(this.i+1)%this.frames.length;}}
  get f(){return this.frames[this.i];}
}

function drawSpr(sheet,f,dx,dy,dw,dh,flip=false){
  if(!sheet||!f)return false;
  ctx.save();
  if(flip){ctx.translate(dx+dw,dy);ctx.scale(-1,1);ctx.drawImage(sheet,f.sx,f.sy,f.sw,f.sh,0,0,dw,dh);}
  else ctx.drawImage(sheet,f.sx,f.sy,f.sw,f.sh,dx,dy,dw,dh);
  ctx.restore();return true;
}

/* ── プレイヤー ── */
class Player{
  constructor(){
    this.x=80;this.y=390;this.w=52;this.h=78;
    this.vx=0;this.vy=0;this.onG=false;this.jc=0;
    this.mode=0;this.gp=MAX_GP;this.dir=1;
    this.state='idle';this.stT=0;this.inv=0;
    this.arrows=[];this.chgT=0;this.inCar=false;this.carVx=0;
    this.bowPhase=0;this.bowArrowFired=false;
    this.carEnterPhase=0;
    this._anims();
  }
  _anims(){
    const a=(frames,fps)=>new Anim(frames,fps);
    this.aH={idle:a(SP.H.idle,2),walk:a(SP.H.walk,10),run:a(SP.H.run,14),
              jump:a(SP.H.jump,8),dmg:a(SP.H.dmg,10),fall:a(SP.H.fall,4),
              bow:a(SP.H.bow,10),carD:a(SP.H.carD,8)};
    this.aG={idle:a(SP.G.idle,2),walk:a(SP.G.walk,10),run:a(SP.G.run,14),
              jump:a(SP.G.jump,8),jump2:a(SP.G.jump2,8),
              punch:a(SP.G.punch,12),dmg:a(SP.G.dmg,10),fall:a(SP.G.fall,4)};
  }
  get an(){return this.mode===0?this.aH:this.aG;}
  get spd(){return this.mode===0?SPD_H:SPD_G;}

  damage(n=1){
    if(this.inv>0||this.state==='fall')return;
    this.gp=Math.max(0,this.gp-n);
    this.inv=1.8;this.stT=0.4;this.state='dmg';this.vx=-this.dir*3.5;
    if(this.gp<=0){this.state='fall';this.stT=3;}
    if(navigator.vibrate)navigator.vibrate(60);
  }

  update(dt,plats,items,enemies,stage){
    if(this.chgT>0){this.chgT-=dt;return;}
    if(this.inv>0)this.inv-=dt;
    const dead=this.state==='fall',stunned=this.state==='dmg'||dead;
    const atk=this.state==='bow'||this.state==='punch';
    const carEntering=this.state==='car_enter';
    if(this.stT>0){
      this.stT-=dt;
      if(this.stT<=0&&!dead){
        if(this.state==='car_enter'){this.inCar=true;this.carVx=2;this.carEnterPhase=0;}
        this.state='idle';
      }
    }
    // 弓フェーズ更新（0=引き, 1=満弦+発射, 2=残影）
    if(this.state==='bow'){
      const t=this.stT;
      this.bowPhase=t>0.35?0:t>0.15?1:2;
      if(this.bowPhase>=1&&!this.bowArrowFired){
        this.bowArrowFired=true;
        this.arrows.push(new Arrow(this.x+(this.dir>0?this.w+4:-4),this.y+this.h*.38,this.dir));
      }
    }
    // 車乗り込みフェーズ
    if(this.state==='car_enter'){
      this.carEnterPhase=this.stT>1.0?1:this.stT>0.5?2:3;
    }

    if(!stunned&&!dead){
      if(this.inCar){this._carUpd(dt,plats,stage);return;}
      if(carEntering){this.vx*=0.85;}
      else if(!atk){
        if(isL()){this.vx=-this.spd;this.dir=-1;}
        else if(isR()){this.vx=this.spd;this.dir=1;}
        else this.vx*=0.72;
        if(pollJump()){
          if(this.onG){this.vy=JV;this.jc=1;this.onG=false;}
          else if(this.mode===1&&this.jc===1){this.vy=JV2;this.jc=2;}
        }
        if(pollAtk()){
          if(this.mode===0){this.state='bow';this.stT=0.55;this.bowPhase=0;this.bowArrowFired=false;}
          else{this.state='punch';this.stT=0.38;this._punch(enemies,stage);}
        }
        if(pollChg()){this.mode=this.mode===0?1:0;this.chgT=0.3;this.state='idle';this.vx=0;}
        // ベンツ乗り込み演出
        if(stage&&stage.benz&&!stage.benz.taken&&this.mode===0&&this.onG){
          const bz=stage.benz;
          if(Math.abs(this.x+this.w/2-bz.cx)<90&&(pollJump()||isR())){
            bz.taken=true;this.state='car_enter';this.stT=1.5;this.carEnterPhase=1;this.vx=0;
          }
        }
      } else {
        if(isL())this.vx=-this.spd*.4;
        else if(isR())this.vx=this.spd*.4;
        else this.vx*=0.6;
      }
    } else if(dead)this.vx*=0.85;

    this._phys(dt,plats);
    for(let i=items.length-1;i>=0;i--)if(overlap(this,items[i])){items[i].take(this);items.splice(i,1);}
    if(!stunned&&!dead&&!atk&&!this.inCar&&this.state!=='car_enter'&&this.stT<=0){
      if(!this.onG)this.state=(this.mode===1&&this.jc===2)?'jump2':'jump';
      else if(Math.abs(this.vx)>3)this.state='run';
      else if(Math.abs(this.vx)>.3)this.state='walk';
      else this.state='idle';
    }
    for(const k in this.an)this.an[k].tick(dt);
  }

  _carUpd(dt,plats,stage){
    if(isL())this.carVx=Math.max(this.carVx-.5,-10);
    else if(isR())this.carVx=Math.min(this.carVx+.5,10);
    else this.carVx*=.88;
    this.dir=this.carVx>=0?1:-1;
    if(pollJump()&&this.onG){this.vy=-16;this.onG=false;}
    if(pollChg()){this.inCar=false;this.mode=1;this.chgT=.2;return;}
    this.vx=this.carVx;this._phys(dt,plats);
    this.aH.carD.tick(dt);
  }

  _punch(enemies,stage){
    const reach=76,px=this.dir>0?this.x+this.w:this.x-reach;
    for(const e of enemies)if(e.alive&&overlapR(px,this.y,reach,this.h,e.x,e.y,e.w,e.h))e.hit(2,'punch');
    if(stage)stage.tryBreak(px,this.y,reach,this.h);
  }

  _phys(dt,plats){
    this.vy=Math.min(this.vy+GRAV,20);this.x+=this.vx;this.y+=this.vy;
    this.onG=false;
    for(const p of plats){
      if(!p.solid)continue;
      const ox=Math.min(this.x+this.w,p.x+p.w)-Math.max(this.x,p.x);
      const oy=Math.min(this.y+this.h,p.y+p.h)-Math.max(this.y,p.y);
      if(ox>0&&oy>0){
        if(ox<oy){if(this.x<p.x)this.x=p.x-this.w;else this.x=p.x+p.w;this.vx=0;}
        else{if(this.vy>=0&&this.y<p.y){this.y=p.y-this.h;this.vy=0;this.onG=true;this.jc=0;}
             else if(this.vy<0){this.y=p.y+p.h;this.vy=0;}}
      }
    }
    if(this.y>CH+300)this.damage(this.gp);
  }

  draw(cx){
    const dx=this.x-cx;
    if(this.inv>0&&Math.floor(this.inv*8)%2)return;
    if(this.chgT>0){
      ctx.save();ctx.globalAlpha=Math.min(1,this.chgT*3);
      const g=ctx.createRadialGradient(dx+this.w/2,this.y+this.h/2,0,dx+this.w/2,this.y+this.h/2,60);
      g.addColorStop(0,'rgba(255,255,0,.9)');g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(dx+this.w/2,this.y+this.h/2,60,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    if(this.inCar){
      // 走行中：arrow_flying.png の3フレーム(各220×220)をサイクル
      if(hiReady&&HIMGS.arrow){
        const fi=Math.floor(performance.now()/220)%3;
        const fw=HIMGS.arrow.width/3,fh=HIMGS.arrow.height;
        const dw=210,dh=Math.round(dw*fh/fw);
        const ix=dx+this.w/2-dw/2,iy=this.y+this.h-dh;
        ctx.drawImage(HIMGS.arrow,fi*fw,0,fw,fh,ix,iy,dw,dh);
      } else {
        const f=this.aH.carD.f,dw=200,dh=120,cy=this.y+this.h-dh;
        if(!drawSpr(IMGS.human2,f,dx-30,cy,dw,dh,this.dir<0)){
          ctx.fillStyle='#e8e8e8';ctx.fillRect(dx-30,cy,dw,dh);
          ctx.font='40px sans-serif';ctx.fillText('🚗',dx+10,cy+70);
        }
      }
    } else {
      const st=this.state;
      // ── 人間モード個別フレーム ──
      if(this.mode===0){
        // 弓矢攻撃アニメ（bow2=引き, bow3=満弦, phase2=idle）
        if(st==='bow'&&hiReady){
          const bowImgs=[HIMGS.bow2,HIMGS.bow3,null];
          const bimg=bowImgs[Math.min(this.bowPhase,2)]||(hfrsReady?HFRS.idle:null);
          if(bimg){
            const DH=120,DW=Math.round(DH*bimg.width/bimg.height);
            const ix=dx+this.w/2-DW/2,iy=this.y+this.h-DH;
            if(this.dir<0){ctx.save();ctx.translate(ix+DW,iy);ctx.scale(-1,1);ctx.drawImage(bimg,0,0,DW,DH);ctx.restore();}
            else ctx.drawImage(bimg,ix,iy,DW,DH);
            return;
          }
        }
        // 車乗り込みアニメ（bow4=ドア際, car1=乗り込み中, car2=着座）
        if(st==='car_enter'&&hiReady){
          const cImgs=[null,HIMGS.bow4,HIMGS.car1,HIMGS.car2];
          const cimg=cImgs[this.carEnterPhase]||HIMGS.car2;
          if(cimg){
            const scale=Math.min(200/cimg.width,120/cimg.height);
            const dw=Math.round(cimg.width*scale),dh=Math.round(cimg.height*scale);
            const ix=dx+this.w/2-dw/2,iy=this.y+this.h-dh;
            ctx.drawImage(cimg,ix,iy,dw,dh);
            return;
          }
        }
        // 通常移動フレーム（idle/walk/run/jump）
        if(hfrsReady&&st!=='bow'&&st!=='car_enter'){
          let img=HFRS.idle;
          if(st==='jump'||st==='jump2') img=HFRS.jump||HFRS.idle;
          else if(st==='run')  img=HFRS.run||HFRS.walk||HFRS.idle;
          else if(st==='walk') img=HFRS.walk||HFRS.idle;
          if(img){
            const DH=120,DW=Math.round(DH*img.width/img.height);
            const ix=dx+this.w/2-DW/2,iy=this.y+this.h-DH;
            if(this.dir<0){ctx.save();ctx.translate(ix+DW,iy);ctx.scale(-1,1);ctx.drawImage(img,0,0,DW,DH);ctx.restore();}
            else ctx.drawImage(img,ix,iy,DW,DH);
            if(st==='punch'&&this.stT<.18){
              const ex=this.dir>0?dx+this.w+4:dx-34;
              ctx.fillStyle='rgba(255,200,0,.8)';
              ctx.beginPath();ctx.arc(ex+15,this.y+this.h*.44,22,0,Math.PI*2);ctx.fill();
            }
            return;
          }
        }
      }
      // ゴリラモード or bow: スプライトシート
      const sheet=this.mode===0?(st==='bow'?IMGS.human2:IMGS.human):IMGS.gorilla;
      const a=this.an;
      let anim=a.idle;
      if(st==='walk')anim=a.walk;
      else if(st==='run')anim=a.run;
      else if(st==='jump')anim=a.jump;
      else if(st==='jump2')anim=a.jump2||a.jump;
      else if(st==='bow')anim=this.aH.bow;
      else if(st==='punch')anim=a.punch||a.idle;
      else if(st==='dmg')anim=a.dmg;
      else if(st==='fall')anim=a.fall;
      const f=anim?anim.f:null;
      if(st==='fall'){
        const fw=this.h,fh=this.w*.7;
        if(!drawSpr(sheet,f,dx-4,this.y+this.h-fh,fw,fh)){
          ctx.fillStyle='#888';ctx.fillRect(dx,this.y,this.w,this.h*.6);
        }
      } else {
        if(!drawSpr(sheet,f,dx,this.y,this.w,this.h,this.dir<0)){
          ctx.fillStyle=this.mode===1?'#2a2a2a':'#1a3a80';
          ctx.fillRect(dx,this.y,this.w,this.h);
          ctx.fillStyle='#ffddbb';ctx.fillRect(dx+this.w*.2,this.y+this.h*.05,this.w*.6,this.h*.28);
        }
      }
      if(st==='punch'&&this.stT<.18){
        const ex=this.dir>0?dx+this.w+4:dx-34;
        ctx.fillStyle='rgba(255,200,0,.8)';
        ctx.beginPath();ctx.arc(ex+15,this.y+this.h*.44,22,0,Math.PI*2);ctx.fill();

  }
}

/* ── 矢 ── */
class Arrow{
  constructor(x,y,d){this.x=x;this.y=y;this.vx=d*14;this.vy=0;this.w=28;this.h=8;this.alive=true;}
  update(enemies,plats){
    this.x+=this.vx;this.vy+=.15;this.y+=this.vy;
    if(this.x<-300||this.x>10000){this.alive=false;return;}
    for(const e of enemies)if(e.alive&&overlapR(this.x,this.y,this.w,this.h,e.x,e.y,e.w,e.h)){
      if(e.type!=='spike')e.hit(1,'arrow');this.alive=false;return;
    }
    for(const p of plats)if(p.solid&&overlapR(this.x,this.y,this.w,this.h,p.x,p.y,p.w,p.h)){this.alive=false;return;}
  }
  draw(cx){
    if(!this.alive)return;
    const dx=this.x-cx,ang=Math.atan2(this.vy,this.vx);
    ctx.save();ctx.translate(dx+this.w/2,this.y+this.h/2);ctx.rotate(ang);
    ctx.fillStyle='#a06020';ctx.fillRect(-this.w/2,-3,this.w,6);
    ctx.fillStyle='#ffee00';ctx.beginPath();
    ctx.moveTo(this.w/2,0);ctx.lineTo(this.w/2+10,-5);ctx.lineTo(this.w/2+10,5);ctx.fill();
    ctx.restore();
  }
}

/* ── 敵 ── */
class Enemy{
  constructor(type,x,y){
    this.type=type;this.x=x;this.y=y;
    this.w=type==='boss'?80:40;this.h=type==='boss'?90:44;
    this.vx=0;this.vy=0;this.alive=true;this.onG=false;
    this.hp={patrol:1,fly:1,spike:3,boss:20}[type]||1;
    this.maxhp=this.hp;
    this.spawnX=x;this._baseY=y;
    this.timer=Math.random()*2;this.phase=0;this.phaseT=2.5;
    this.proj=[];this.alert=0;this.hitFlash=0;
  }
  hit(dmg,src){
    if(src==='arrow'&&this.type==='spike')return;
    this.hp-=dmg;this.hitFlash=.15;if(this.hp<=0)this.alive=false;
  }
  update(dt,player,plats){
    if(!this.alive)return;
    if(this.hitFlash>0)this.hitFlash-=dt;
    if(this.type==='patrol')this._patrol(dt,player,plats);
    else if(this.type==='fly')this._fly(dt,player);
    else if(this.type==='boss')this._boss(dt,player,plats);
  }
  _patrol(dt,player,plats){
    const px=player.x+player.w/2,ex=this.x+this.w/2,dist=Math.abs(px-ex);
    if(this.alert>0)this.alert-=dt;
    else if(dist<320){this.vx=(px>ex)?2.6:-2.6;if(dist<220&&Math.random()<.01&&this.onG)this.vy=-9;}
    else{const d=this.spawnX-this.x;this.vx=Math.abs(d)<20?0:(d>0?1.5:-1.5);}
    this._phys(plats);
  }
  _fly(dt,player){
    this.timer+=dt;this.y=this._baseY+Math.sin(this.timer*2)*28;
    const px=player.x+player.w/2,dist=Math.abs(px-this.x-this.w/2);
    this.vx=(px>this.x+this.w/2)?1.5:-1.5;this.x+=this.vx;
    this.phaseT-=dt;if(this.phaseT<=0&&dist<400){this.phaseT=3;this._dropPeel=true;}
  }
  _boss(dt,player,plats){
    const px=player.x+player.w/2,bx=this.x+this.w/2;
    this.phaseT-=dt;
    if(this.phase===0){
      if(Math.abs(px-bx)>100)this.vx=(px>bx)?2.4:-2.4;else this.vx*=.7;
      this._phys(plats);
      if(this.phaseT<=0){
        const r=Math.random();
        if(r<.35){this.phase=1;this.phaseT=.6;}
        else if(r<.7){this.phase=3;this.phaseT=.7;}
        else{this.phase=5;this.phaseT=.7;}
      }
    } else if(this.phase===1){
      this.vx=0;this._phys(plats);
      if(this.phaseT<=0){this.vy=-18;this.phase=2;this.phaseT=3;}
    } else if(this.phase===2){
      this.vy=Math.min(this.vy+GRAV*2.2,26);this.x+=this.vx;this.y+=this.vy;this._platCol(plats);
      if(this.onG){
        this.proj.push({x:this.x-30,y:this.y+this.h-10,vx:-7,vy:-3,w:20,h:14,t:'shock',life:1.5});
        this.proj.push({x:this.x+this.w+10,y:this.y+this.h-10,vx:7,vy:-3,w:20,h:14,t:'shock',life:1.5});
        this.phase=0;this.phaseT=2;
      }
    } else if(this.phase===3){
      this.vx=0;this._phys(plats);
      if(this.phaseT<=0){
        const d=px>bx?1:-1;
        this.proj.push({x:bx,y:this.y+30,vx:d*8,vy:-2.5,w:22,h:16,t:'carrot',life:3});
        this.proj.push({x:bx,y:this.y+50,vx:d*6,vy:-1.5,w:22,h:16,t:'carrot',life:3});
        this.phase=0;this.phaseT=2.2;
      }
    } else if(this.phase===5){
      this.vx=0;this._phys(plats);
      if(this.phaseT<=0){
        const d=px>bx?1:-1;
        this.proj.push({x:bx-10,y:this.y+44,vx:d*9,vy:0,w:32,h:28,t:'heart',life:2});
        this.phase=0;this.phaseT=2.8;
      }
    }
    for(let i=this.proj.length-1;i>=0;i--){
      const p=this.proj[i];p.x+=p.vx;p.y+=p.vy;
      if(p.t!=='shock'&&p.t!=='heart')p.vy+=.3;
      p.life-=dt;if(p.life<=0||p.x<-500||p.x>10000)this.proj.splice(i,1);
    }
  }
  _phys(plats){this.vy=Math.min(this.vy+GRAV,18);this.x+=this.vx;this.y+=this.vy;this._platCol(plats);}
  _platCol(plats){
    this.onG=false;
    for(const p of plats){if(!p.solid)continue;
      const ox=Math.min(this.x+this.w,p.x+p.w)-Math.max(this.x,p.x);
      const oy=Math.min(this.y+this.h,p.y+p.h)-Math.max(this.y,p.y);
      if(ox>0&&oy>0){
        if(ox<oy){if(this.x<p.x)this.x=p.x-this.w;else this.x=p.x+p.w;this.vx*=-.5;}
        else{if(this.y<p.y){this.y=p.y-this.h;this.vy=0;this.onG=true;}else{this.y=p.y+p.h;this.vy=0;}}
      }
    }
  }
  draw(cx){
    if(!this.alive)return;
    const dx=this.x-cx;
    if(dx+this.w<-100||dx>CW+100)return;
    if(this.hitFlash>0)ctx.globalAlpha=.4;
    if(this.type==='patrol')this._drawRabbit(dx,false);
    else if(this.type==='fly')this._drawRabbit(dx,true);
    else if(this.type==='spike')this._drawSpike(dx);
    else if(this.type==='boss')this._drawBoss(dx,cx);
    ctx.globalAlpha=1;
    if(this.alert>0){
      ctx.fillStyle='#f00';ctx.font='bold 22px sans-serif';
      ctx.textAlign='center';ctx.fillText('!',dx+this.w/2,this.y-6);ctx.textAlign='left';
    }
  }
  _drawRabbit(dx,fly){
    const {y,w,h}=this;
    // 耳
    ctx.fillStyle='#f0f0f0';ctx.fillRect(dx+w*.2-1,y-h*.36,10,h*.4);ctx.fillRect(dx+w*.65,y-h*.36,10,h*.4);
    ctx.fillStyle='#ffb8c8';ctx.fillRect(dx+w*.22,y-h*.3,5,h*.3);ctx.fillRect(dx+w*.67,y-h*.3,5,h*.3);
    // 体
    ctx.fillStyle='#f0f0f0';ctx.fillRect(dx+4,y+h*.28,w-8,h*.7);
    ctx.fillRect(dx+6,y+h*.04,w-12,h*.3);
    // 目
    ctx.fillStyle='#e00';ctx.fillRect(dx+w*.2,y+h*.14,6,6);ctx.fillRect(dx+w*.6,y+h*.14,6,6);
    // ひげ
    ctx.strokeStyle='#bbb';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(dx+4,y+h*.27);ctx.lineTo(dx+w*.38,y+h*.25);ctx.stroke();
    ctx.beginPath();ctx.moveTo(dx+w*.62,y+h*.25);ctx.lineTo(dx+w-4,y+h*.27);ctx.stroke();
    // 足
    ctx.fillStyle='#e8e8e8';ctx.fillRect(dx+2,y+h*.94,12,10);ctx.fillRect(dx+w-14,y+h*.94,12,10);
    if(fly){
      ctx.fillStyle='rgba(160,210,255,.7)';
      ctx.beginPath();ctx.ellipse(dx-12,y+h*.45,18,10,-.3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(dx+w+12,y+h*.45,18,10,.3,0,Math.PI*2);ctx.fill();
    }
  }
  _drawSpike(dx){
    const {y,w,h}=this;
    ctx.fillStyle='#334455';ctx.fillRect(dx,y,w,h);
    ctx.fillStyle='#556677';
    for(let i=0;i<5;i++){
      const sx=dx+i*8+2;
      ctx.beginPath();ctx.moveTo(sx,y);ctx.lineTo(sx+4,y-14);ctx.lineTo(sx+8,y);ctx.fill();
      ctx.beginPath();ctx.moveTo(sx,y+h);ctx.lineTo(sx+4,y+h+14);ctx.lineTo(sx+8,y+h);ctx.fill();
    }
    ctx.fillStyle='#e00';ctx.fillRect(dx+7,y+h*.2,8,8);ctx.fillRect(dx+w-15,y+h*.2,8,8);
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.font='bold 10px sans-serif';
    ctx.textAlign='center';ctx.fillText('ゴリラのみ',dx+w/2,y-18);ctx.textAlign='left';
  }
  _drawBoss(dx,cx){
    const {y,w,h}=this;
    // 王冠
    ctx.fillStyle='#ffd700';
    ctx.beginPath();
    ctx.moveTo(dx+10,y-24);ctx.lineTo(dx+10,y-4);ctx.lineTo(dx+w-10,y-4);ctx.lineTo(dx+w-10,y-24);
    ctx.lineTo(dx+w*.75,y-12);ctx.lineTo(dx+w/2,y-22);ctx.lineTo(dx+w*.25,y-12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff4';ctx.fillRect(dx+10,y-8,8,8);ctx.fillRect(dx+w/2-4,y-8,8,8);ctx.fillRect(dx+w-18,y-8,8,8);
    // 体（大うさぎ）
    ctx.fillStyle='#fff';ctx.fillRect(dx+8,y+h*.2,w-16,h*.78);ctx.fillRect(dx+10,y,w-20,h*.26);
    // 耳
    ctx.fillStyle='#fff';ctx.fillRect(dx+12,y-h*.65,16,h*.68);ctx.fillRect(dx+w-28,y-h*.65,16,h*.68);
    ctx.fillStyle='#ffb8c8';ctx.fillRect(dx+15,y-h*.58,9,h*.52);ctx.fillRect(dx+w-24,y-h*.58,9,h*.52);
    // 目
    ctx.fillStyle='#cc0000';
    ctx.beginPath();ctx.arc(dx+w*.28,y+h*.1,7,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(dx+w*.72,y+h*.1,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(dx+w*.28,y+h*.1,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(dx+w*.72,y+h*.1,3,0,Math.PI*2);ctx.fill();
    // HP
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(dx-4,y-h*.88,w+8,14);
    ctx.fillStyle='#f44';ctx.fillRect(dx-4,y-h*.88,Math.max(0,(w+8)*this.hp/this.maxhp),14);
    ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(dx-4,y-h*.88,w+8,14);
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText('うさぎ大王',dx+w/2,y-h*.88+11);ctx.textAlign='left';
    // 飛び道具
    for(const p of this.proj){
      const px=p.x-cx;
      if(p.t==='carrot'){ctx.fillStyle='#ff8800';ctx.fillRect(px,p.y,p.w,p.h);ctx.fillStyle='#009900';ctx.fillRect(px+5,p.y-9,10,11);}
      else if(p.t==='heart'){ctx.fillStyle='#ff44aa';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText('♥',px+p.w/2,p.y+p.h);ctx.textAlign='left';}
      else if(p.t==='shock'){ctx.fillStyle='rgba(255,220,50,.8)';ctx.fillRect(px,p.y,p.w,p.h);}
    }
  }
}

  update(plats){

        ctx.moveTo(dx+18,p.y);ctx.lineTo(dx+26,p.y+p.h);ctx.stroke();
        ctx.fillStyle='rgba(0,0,0,.7)';ctx.font='bold 10px sans-serif';
        ctx.textAlign='center';ctx.fillText('ゴリラパンチ',dx+p.w/2,p.y-5);ctx.textAlign='left';
      }
    }
    this._drawHosp(cx);this._drawShutter(cx);
    this.benz.draw(cx);
    for(const b of this.bananas)b.draw(cx);
    for(const p of this.peels)p.draw(cx);
  }
  _drawHosp(cx){
    const dx=this.hospX-cx,w=this.hospW,h=165,y=316;
    if(dx+w<-50||dx>CW+50)return;
    ctx.fillStyle='#aac4ff';ctx.fillRect(dx,y,w,h);
    ctx.fillStyle='#8aacee';ctx.fillRect(dx-8,y-48,w+16,52);
    ctx.fillStyle='#ee4444';ctx.fillRect(dx+88,y-40,56,78);ctx.fillRect(dx+70,y-22,94,42);
    ctx.fillStyle='rgba(200,230,255,.8)';ctx.fillRect(dx+14,y+20,50,50);ctx.fillRect(dx+w-64,y+20,50,50);
    ctx.fillStyle='#fff';ctx.fillRect(dx+102,y+88,56,78);
    ctx.fillStyle='#ffee88';ctx.fillRect(dx+8,y+8,100,34);
    ctx.fillStyle='#000';ctx.font='12px sans-serif';ctx.fillText('動物病院',dx+12,y+29);
    if(!this.hospUsed){
      ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
      ctx.fillText('入口に触れる→ゴリラで回復',dx+w/2,y-54);ctx.textAlign='left';
    }
  }
  _drawShutter(cx){
    const dx=this.shutterX-cx;if(dx+40<0||dx>CW)return;
    ctx.fillStyle='#555';ctx.fillRect(dx,290,30,192);
    ctx.strokeStyle='#888';ctx.lineWidth=2;
    for(let y=298;y<482;y+=18){ctx.beginPath();ctx.moveTo(dx,y);ctx.lineTo(dx+30,y);ctx.stroke();}
  }
}

/* ── ユーティリティ ── */
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function overlapR(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}

/* ── ゲーム管理 ── */
let gs=GS.TITLE,player,stage,camX=0,peels=[];
let hospMsg='',hospTimer=0,transTimer=0,titleT=0,lastT=0;

// ── ロックマン式: 画面単位スクロール ──
let screenAnchor=0;   // 現在の画面の左端 (world座標)
let scrSliding=false; // スライド中か
let scrSlideDir=0;    // 1=右, -1=左
let scrSlideT=0;
const SCR_SLIDE_DUR=0.28; // スライド時間(秒)

// ロックマン式シャッター（ボス部屋専用）
const STRIPS=8, STRIP_H=CH/STRIPS;
const TRANS_CLOSE=0.45, TRANS_HOLD=0.15, TRANS_OPEN=0.4;
const TRANS_TOTAL=TRANS_CLOSE+TRANS_HOLD+TRANS_OPEN;
let transCamDone=false;

async function init(){
  resize();
  loadHumanFrames();loadHumanAnim();
  if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});
  await Promise.all([loadImg('title','title.png'),loadImg('human','human.png'),loadImg('gorilla','gorilla.png'),loadImg('human2','human2.png')]);
  showCtrl(false);
  requestAnimationFrame(loop);
}

function showCtrl(v){document.getElementById('ctrl').style.visibility=v?'visible':'hidden';}

function startGame(){
  player=new Player();stage=new Stage();
  camX=0;peels=[];
  screenAnchor=0;scrSliding=false;scrSlideT=0;scrSlideDir=0;
  gs=GS.PLAY;
  showCtrl(true);
}

cv.addEventListener('pointerdown',()=>{
  if(gs===GS.TITLE){startGame();return;}
  if(gs===GS.CLEAR||gs===GS.OVER){gs=GS.TITLE;showCtrl(false);}
});
document.addEventListener('keydown',e=>{
  if((e.code==='Enter'||e.code==='Space')&&(gs===GS.TITLE))startGame();
  if((e.code==='Enter')&&(gs===GS.CLEAR||gs===GS.OVER))gs=GS.TITLE;
});

function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;
  ctx.clearRect(0,0,CW,CH);
  if(gs===GS.TITLE)drawTitle(dt);
  else if(gs===GS.PLAY||gs===GS.BOSS)updatePlay(dt);
  else if(gs===GS.TRANS)updateTrans(dt);
  else if(gs===GS.HOSP)updateHosp(dt);
  else if(gs===GS.CLEAR)drawClear();
  else if(gs===GS.OVER)drawOver();
  requestAnimationFrame(loop);
}

function drawTitle(dt){
  titleT+=dt;
  if(IMGS.title)ctx.drawImage(IMGS.title,0,0,CW,CH);
  else{
    const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#0a0020');g.addColorStop(1,'#1a0040');
    ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='#fff';ctx.font='bold 58px sans-serif';ctx.textAlign='center';ctx.fillText('仮面ゴリラー',CW/2,200);ctx.textAlign='left';
  }
  if(Math.floor(titleT*2)%2===0){
    ctx.fillStyle='rgba(255,255,255,.92)';ctx.font='bold 26px sans-serif';ctx.textAlign='center';
    ctx.fillText('▶ タップしてスタート',CW/2,CH-38);ctx.textAlign='left';
  }
}

function drawBG(){
  const bg=ctx.createLinearGradient(0,0,0,CH);
  if(gs===GS.BOSS){bg.addColorStop(0,'#1a0a00');bg.addColorStop(.6,'#3a1800');bg.addColorStop(1,'#2a4a10');}
  else{bg.addColorStop(0,'#0a1528');bg.addColorStop(.65,'#183060');bg.addColorStop(1,'#204a18');}
  ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle=gs===GS.BOSS?'rgba(255,100,0,.4)':'rgba(255,240,200,.32)';
  ctx.beginPath();ctx.arc(820,68,58,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.45)';
  [[60,45],[180,82],[740,32],[880,76],[940,42],[110,22],[560,65]].forEach(([sx,sy])=>ctx.fillRect(sx,sy,2,2));
}

function drawScene(){
  drawBG();stage.draw(camX);
  for(const e of stage.enemies)e.draw(camX);
  for(const a of player.arrows)a.draw(camX);
  player.draw(camX);
  // HUD
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(4,4,206,46);
  ctx.strokeStyle='#666';ctx.lineWidth=1;ctx.strokeRect(4,4,206,46);
  ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.fillText('GP',10,30);
  for(let i=0;i<MAX_GP;i++){
    ctx.save();ctx.globalAlpha=i<player.gp?1:.25;ctx.font='30px sans-serif';ctx.fillText('🍌',42+i*55,38);ctx.restore();
  }
  const mc=player.mode===1?'rgba(30,120,50,.7)':'rgba(30,80,160,.7)';
  ctx.fillStyle=mc;ctx.fillRect(4,54,178,28);ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';
  ctx.fillText(player.mode===1?'🦍 ゴリラ':'🧑 人間',10,71);
  if(!('ontouchstart' in window)){
    ctx.fillStyle='rgba(255,255,255,.38)';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText('↑/Z:ジャンプ X:攻撃 C:変身',CW-6,16);ctx.textAlign='left';
  }
}

/* ── 画面端チェック（ロックマン方式） ── */
function checkScreenEdge(){
  if(scrSliding||gs===GS.BOSS)return;
  const localX=player.x-screenAnchor;
  // 右端
  if(localX+player.w>=CW-6){
    const nextAnchor=screenAnchor+CW;
    // ボス部屋シャッター判定
    if(gs!==GS.BOSS&&screenAnchor+CW>stage.shutterX){
      gs=GS.TRANS;transTimer=0;transCamDone=false;return;
    }
    // 次の画面へ
    if(nextAnchor<stage.worldW){
      scrSliding=true;scrSlideDir=1;scrSlideT=0;
    } else {
      player.x=screenAnchor+CW-player.w-6;player.vx=0;
    }
  }
  // 左端
  else if(localX<=6&&screenAnchor>0){
    scrSliding=true;scrSlideDir=-1;scrSlideT=0;
  } else if(localX<0){
    player.x=screenAnchor+6;player.vx=0;
  }
}

/* ── カメラ更新 ── */
function updateCamera(dt){
  if(gs===GS.BOSS){
    // ボス部屋はある程度自由スクロール
    const bossLeft=stage.shutterX+60;
    camX+=(player.x-CW*.38-camX)*.1;
    camX=Math.max(bossLeft,Math.min(camX,stage.worldW-CW));
    return;
  }
  if(scrSliding){
    scrSlideT+=dt;
    const p=Math.min(1,scrSlideT/SCR_SLIDE_DUR);
    camX=screenAnchor+scrSlideDir*CW*p;
    // プレイヤーを画面とともに運ぶ
    player.vx=0;player.vy=0;
    if(scrSlideDir===1)player.x=camX+14;
    else player.x=camX+CW-player.w-14;
    if(scrSlideT>=SCR_SLIDE_DUR){
      screenAnchor+=scrSlideDir*CW;
      camX=screenAnchor;
      scrSliding=false;scrSlideT=0;
      // 到着後の位置確定
      if(scrSlideDir===1)player.x=camX+14;
      else player.x=camX+CW-player.w-14;
    }
  } else {
    camX=screenAnchor;
  }
}

function updatePlay(dt){
  // スライド中は物理を止めて描画のみ
  if(scrSliding){
    updateCamera(dt);
    drawScene();
    return;
  }

  // 病院判定
  if(!stage.hospUsed){
    const hx=stage.hospX,hw=stage.hospW;
    if(player.x+player.w>hx+hw*.3&&player.x<hx+hw*.9&&player.y+player.h>455){
      stage.hospUsed=true;
      if(player.mode===1){hospMsg='あら、たくみじゃない！\nゴリラポイントを回復しておくわね♪';player.gp=MAX_GP;}
      else hospMsg='うちは人間はみれないんです、\nごめんなさい！';
      hospTimer=4;gs=GS.HOSP;return;
    }
  }

  // 皮
  for(let i=peels.length-1;i>=0;i--){peels[i].update(stage.plats);if(!peels[i].alive)peels.splice(i,1);}
  // プレイヤー
  player.update(dt,stage.plats,stage.bananas,stage.enemies,stage);
  // 矢
  for(let i=player.arrows.length-1;i>=0;i--){player.arrows[i].update(stage.enemies,stage.plats);if(!player.arrows[i].alive)player.arrows.splice(i,1);}
  // 敵
  for(const e of stage.enemies){
    if(!e.alive)continue;
    e.update(dt,player,stage.plats);
    if(e._dropPeel){e._dropPeel=false;peels.push(new Peel(e.x+e.w/2,e.y+e.h));}
    if(e.type==='boss'){
      for(const p of e.proj)if(overlapR(player.x,player.y,player.w,player.h,p.x,p.y,p.w,p.h))player.damage(1);
      if(!e.alive){gs=GS.CLEAR;return;}
    }
    if(e.type!=='boss'&&e.alive&&player.inv<=0&&overlap(player,e))player.damage(1);
  }

  // 画面端チェック → スクロールまたはシャッター
  checkScreenEdge();
  if(gs!==GS.PLAY&&gs!==GS.BOSS)return;

  // カメラ更新
  updateCamera(dt);

  if(player.gp<=0&&player.state==='fall'&&player.stT<=0){gs=GS.OVER;return;}
  drawScene();
}

function updateHosp(dt){
  hospTimer-=dt;drawScene();
  ctx.fillStyle='rgba(0,0,60,.92)';ctx.fillRect(50,CH-210,CW-100,155);
  ctx.strokeStyle='#99f';ctx.lineWidth=3;ctx.strokeRect(50,CH-210,CW-100,155);
  ctx.fillStyle='#fff';ctx.font='22px sans-serif';
  hospMsg.split('\n').forEach((l,i)=>ctx.fillText(l,72,CH-172+i*40));
  if(hospTimer<=0){
    ctx.fillStyle='rgba(255,255,255,.65)';ctx.font='14px sans-serif';ctx.fillText('▼ ボタンを押して続ける',72,CH-72);
    if(pollJump()||pollAtk()||pollChg())gs=GS.PLAY;
  }
}

function updateTrans(dt){
  transTimer+=dt;

  // カメラスナップはシャッターが完全に閉じた瞬間
  if(transTimer>=TRANS_CLOSE&&!transCamDone){
    camX=stage.shutterX+80;screenAnchor=stage.shutterX+80;transCamDone=true;
  }
  drawScene();
  _drawShutterStrips(transTimer);
  if(transTimer>=TRANS_TOTAL)gs=GS.BOSS;
}
function _drawShutterStrips(t){
  for(let i=0;i<STRIPS;i++){
    const fromLeft=(i%2===0);
    let slideX;
    if(t<=TRANS_CLOSE){
      // 閉じる: 0→1
      const p=t/TRANS_CLOSE;
      const easedP=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; // ease in-out
      slideX=fromLeft?(-CW+easedP*CW):(CW-easedP*CW);
    } else if(t<=TRANS_CLOSE+TRANS_HOLD){
      // 全閉（黒）
      slideX=0;
    } else {
      // 開く: 0→1
      const p=(t-TRANS_CLOSE-TRANS_HOLD)/TRANS_OPEN;
      const easedP=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      slideX=fromLeft?(-easedP*CW):(easedP*CW);
    }
    // 帯描画
    ctx.fillStyle='#111';
    ctx.fillRect(slideX,i*STRIP_H,CW,STRIP_H+1);
    // 帯の端にハイライト（ロックマンぽいエッジ）
    ctx.fillStyle='#444';
    if(fromLeft)ctx.fillRect(slideX+CW-4,i*STRIP_H,4,STRIP_H+1);
    else ctx.fillRect(slideX,i*STRIP_H,4,STRIP_H+1);
  }
}

function drawClear(){
  drawScene();ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='#ffd700';ctx.font='bold 84px sans-serif';ctx.textAlign='center';ctx.fillText('CLEAR!',CW/2,CH/2-20);
  ctx.fillStyle='#fff';ctx.font='28px sans-serif';ctx.fillText('うさぎ大王を倒した！',CW/2,CH/2+48);
  ctx.font='18px sans-serif';ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('タップで戻る',CW/2,CH/2+92);ctx.textAlign='left';
}

function drawOver(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='#ff3333';ctx.font='bold 76px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',CW/2,CH/2);
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='22px sans-serif';ctx.fillText('タップで戻る',CW/2,CH/2+60);ctx.textAlign='left';
}

init();
</script>
</body>
</html>
